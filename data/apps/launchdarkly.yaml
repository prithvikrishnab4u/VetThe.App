name: "LaunchDarkly"
category: "development"
website: "https://launchdarkly.com"
description: "LaunchDarkly is a feature management platform for feature flags, experimentation, and progressive delivery."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "free"
    plan: "Developer"
    protocols: ["SAML"]
    notes: "SSO with SAML 2.0 is available on all listed plans (Developer, Foundation, Enterprise), supporting IdPs like Okta, Entra ID, Google Workspace, ADFS and OneLogin."
    source: "https://launchdarkly.com/pricing/"
    checked: "2026-09-22"
  sso_enforcement:
    support: "undocumented"
    notes: "No vendor documentation found stating whether admins can require SSO-only login and disable password login."
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SCIM becomes available after enabling SSO, only for customers on the Enterprise plan; supports automated provisioning and optional IdP group sync."
    source: "https://launchdarkly.com/docs/home/account-security/sso"
    checked: "2026-09-22"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    notes: "Org admins can require all newly invited account members to enable MFA at first login; once required, members cannot disable it."
    source: "https://launchdarkly.com/docs/home/account/mfa"
    checked: "2026-09-22"
  phishing_resistant_mfa:
    support: "not_supported"
    notes: "MFA setup documentation only describes TOTP-based authenticator apps; no WebAuthn/passkey/hardware key option is documented."
    source: "https://launchdarkly.com/docs/home/account/mfa"
    checked: "2026-09-22"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Audit logging of account/org changes is listed as an Enterprise-plan feature on the pricing page."
    source: "https://launchdarkly.com/pricing/"
    checked: "2026-09-22"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
