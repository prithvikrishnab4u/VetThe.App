name: "Freshdesk"
category: "sales_marketing"
website: "https://freshdesk.com"
description: "Online cloud-based customer service software providing help desk support with all smart automations."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Pro"
    notes: "Pricing page lists SSO on Pro and Enterprise; the SSO help article lists Free through Enterprise. Freshworks supports SAML, OAuth2, OIDC and JWT"
    protocols: ["SAML", "OIDC"]
    source: "https://www.freshworks.com/freshdesk/pricing/"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    notes: "Freshworks org admins can mandate 2FA as a policy for all users (with exemptions); requires Freshworks login; plan requirement not stated"
    source: "https://support.freshworks.com/support/solutions/articles/50000003252-how-can-an-organization-admin-enforce-2fa-as-a-policy-for-all-or-some-users-in-the-organization-"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Tracks admin changes (who, when, IP, what changed); retention not stated"
    source: "https://support.freshdesk.com/support/solutions/articles/235745-track-changes-using-audit-log"
    checked: "2026-09-15"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
