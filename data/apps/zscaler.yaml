name: "Zscaler"
category: "security"
website: "https://www.zscaler.com"
description: "Cloud security company that provides services for securely transforming networks and applications."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (contact-sales only, no self-serve or free tier)"
    protocols: ["SAML", "OIDC"]
    notes: "Admins sign in through Authentication Service (ZIdentity) with external SAML or OIDC IdPs. Zscaler has no self-serve or free plan; all subscriptions are custom, contact-sales bundles."
    source: "https://www.zscaler.com/pricing"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (contact-sales only, no self-serve or free tier)"
    notes: "External IdPs provision users over SCIM, including deactivate requests. Zscaler has no self-serve or free plan; all subscriptions are custom, contact-sales bundles."
    source: "https://www.zscaler.com/pricing"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (contact-sales only, no self-serve or free tier)"
    notes: "MFA is required by default for all admins in Authentication Service. Zscaler has no self-serve or free plan; all subscriptions are custom, contact-sales bundles."
    source: "https://www.zscaler.com/pricing"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (contact-sales only, no self-serve or free tier)"
    notes: "FIDO2 security keys or biometrics as second factor or passwordless primary authenticator. Zscaler has no self-serve or free plan; all subscriptions are custom, contact-sales bundles."
    source: "https://www.zscaler.com/pricing"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (contact-sales only, no self-serve or free tier)"
    retention: "6 months"
    notes: "Admin and API actions logged with filtering and CSV export. Zscaler has no self-serve or free plan; all subscriptions are custom, contact-sales bundles."
    source: "https://www.zscaler.com/pricing"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (contact-sales only, no self-serve or free tier)"
    notes: "Users can be added via SSO just-in-time provisioning. Zscaler has no self-serve or free plan; all subscriptions are custom, contact-sales bundles."
    source: "https://www.zscaler.com/pricing"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
    notes: "help.zscaler.com renders via JavaScript and returned no content. Needs a browser check."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
