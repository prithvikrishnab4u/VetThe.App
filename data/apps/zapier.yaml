name: "Zapier"
category: "productivity"
website: "https://zapier.com"
description: "Automation platform that connects your apps and services to automate workflows."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Zapier documentation states Enterprise account SSO (SAML) is supported."
    protocols: ["SAML"]
    source: "https://docs.zapier.com/mcp/manage/security"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Team"
    notes: "SAML SSO supports Just-in-Time provisioning."
    source: "https://help.zapier.com/hc/en-us/articles/8496279747085-Set-up-single-sign-on-with-SAML"
    checked: "2026-09-16"
  domain_verification:
    support: "supported"
    tier: "paid"
    plan: "Team"
    notes: "Verify by DNS TXT, meta tag or HTML file; enables SSO and domain capture."
    source: "https://help.zapier.com/hc/en-us/articles/34976125153677-Verify-ownership-of-your-domain-in-Zapier"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
