name: "Gong"
category: "sales_marketing"
website: "https://www.gong.io"
description: "Revenue intelligence platform capturing customer interactions."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML 2.0 SSO and OpenID Connect; plan requirement not stated"
    protocols: ["SAML", "OIDC"]
    source: "https://help.gong.io/docs/summary-of-security-features"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "Admins can require sign-in via SAML and disable Gong username and password; plan requirement not stated"
    source: "https://help.gong.io/docs/authentication-faqs"
    checked: "2026-09-15"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Any Gong plan"
    notes: "Custom SCIM source plus Okta and other IdP provisioning"
    source: "https://help.gong.io/docs/provision-team-members-from-a-custom-source-scim"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Audit API returns platform usage data in JSON; plan requirement not stated"
    source: "https://help.gong.io/docs/summary-of-security-features"
    checked: "2026-09-15"
  jit_provisioning:
    support: "undocumented"
    notes: "Gong documents SSO and SCIM or Salesforce provisioning but doesn't say whether accounts are created on first SSO sign-in."
  domain_verification:
    support: "undocumented"
    notes: "Gong only imports users whose email is on the primary company domain, and documents no DNS or ownership proof for it."
  custom_roles:
    support: "supported"
    notes: "Granular permission profiles in addition to built-in roles; plan requirement not stated"
    source: "https://help.gong.io/docs/summary-of-security-features"
    checked: "2026-09-15"
  group_role_mapping:
    support: "supported"
    tier: "paid"
    plan: "Any Gong plan"
    notes: "SCIM source groups can be assigned seats, workspaces and permission profiles"
    source: "https://help.gong.io/docs/provision-team-members-from-a-custom-source-scim"
    checked: "2026-09-15"
  session_controls:
    support: "supported"
    notes: "SAML session timeout customizable, default 30 minutes; plan requirement not stated"
    source: "https://help.gong.io/docs/authentication-faqs"
    checked: "2026-09-15"
  api_token_controls:
    support: "not_researched"
