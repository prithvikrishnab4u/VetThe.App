name: "Gong"
category: "sales_marketing"
website: "https://www.gong.io"
description: "Revenue intelligence platform capturing customer interactions."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (Gong is contact-sales only; no self-serve/free tier)"
    protocols: ["SAML", "OIDC"]
    notes: "SAML 2.0 SSO and OpenID Connect; help docs state security features are \"Available on: Any Gong plan\"; Gong has no public self-serve or free plan, all plans are quoted via sales"
    source: "https://www.gong.io/pricing/"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (Gong is contact-sales only; no self-serve/free tier)"
    notes: "Admins can require sign-in via SAML and disable Gong username and password; Gong has no public self-serve or free plan, all plans are quoted via sales"
    source: "https://www.gong.io/pricing/"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Any Gong plan"
    notes: "Custom SCIM source plus Okta and other IdP provisioning"
    source: "https://help.gong.io/docs/provision-team-members-from-a-custom-source-scim"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (Gong is contact-sales only; no self-serve/free tier)"
    notes: "Audit API returns platform usage data in JSON; help docs state security features are \"Available on: Any Gong plan\"; Gong has no public self-serve or free plan, all plans are quoted via sales"
    source: "https://www.gong.io/pricing/"
    checked: "2026-09-16"
  jit_provisioning:
    support: "undocumented"
    notes: "Gong documents SSO and SCIM or Salesforce provisioning but doesn't say whether accounts are created on first SSO sign-in."
  domain_verification:
    support: "undocumented"
    notes: "Gong only imports users whose email is on the primary company domain, and documents no DNS or ownership proof for it."
  custom_roles:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (Gong is contact-sales only; no self-serve/free tier)"
    notes: "Granular permission profiles in addition to built-in roles; help docs state security features are \"Available on: Any Gong plan\"; Gong has no public self-serve or free plan, all plans are quoted via sales"
    source: "https://www.gong.io/pricing/"
    checked: "2026-09-16"
  group_role_mapping:
    support: "supported"
    tier: "paid"
    plan: "Any Gong plan"
    notes: "SCIM source groups can be assigned seats, workspaces and permission profiles"
    source: "https://help.gong.io/docs/provision-team-members-from-a-custom-source-scim"
    checked: "2026-09-15"
  session_controls:
    support: "supported"
    tier: "enterprise"
    plan: "All plans (Gong is contact-sales only; no self-serve/free tier)"
    notes: "SAML session timeout customizable, default 30 minutes; Gong has no public self-serve or free plan, all plans are quoted via sales"
    source: "https://www.gong.io/pricing/"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
