name: "Tailscale"
category: "security"
website: "https://tailscale.com"
description: "Tailscale is a zero-config VPN and network access platform built on WireGuard for connecting devices and services."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "free"
    protocols: ["OIDC"]
    notes: "Login to the admin console/tailnet is via a third-party identity provider (Google, Microsoft, GitHub, Okta, custom OIDC, etc.); no native password login."
    source: "https://tailscale.com/docs/integrations/identity"
    checked: "2026-09-22"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Standard"
    notes: "SCIM user/group provisioning is available on Standard, Premium, and Enterprise plans; confirmed for Microsoft Entra ID."
    source: "https://tailscale.com/kb/1249/sso-entra-id-scim"
    checked: "2026-09-22"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "free"
    notes: "Configuration and webhook audit logs are available on all plans; Premium and higher additionally get network flow logs."
    source: "https://tailscale.com/blog/pricing-v4"
    checked: "2026-09-22"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
