name: "PandaDoc"
category: "productivity"
website: "https://www.pandadoc.com"
description: "All-in-one document automation software to create, approve, track, and eSign documents."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SAML 2.0 SSO on Enterprise; paid add-on for Business plan"
    protocols: ["SAML"]
    source: "https://support.pandadoc.com/en/articles/9715050-sso-implementation"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Admins can restrict password login to specific members and enforce SSO for everyone else"
    source: "https://support.pandadoc.com/en/articles/9715050-sso-implementation"
    checked: "2026-09-15"
  scim:
    support: "supported"
    notes: "SCIM 1.1 and 2.0 documented alongside SSO; plan requirement not stated"
    source: "https://support.pandadoc.com/en/articles/9715050-sso-implementation"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "not_supported"
    notes: "2FA can only be enabled individually by each user; enforce via SSO IdP instead"
    source: "https://support.pandadoc.com/en/articles/9715012-two-factor-authentication-2fa"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "not_supported"
    notes: "Only authenticator app and SMS; physical security keys not supported"
    source: "https://support.pandadoc.com/en/articles/9715012-two-factor-authentication-2fa"
    checked: "2026-09-15"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "CSV download of account activity; owner-only access; 10 event types"
    retention: "30 days"
    source: "https://support.pandadoc.com/en/articles/9715049-audit-log"
    checked: "2026-09-15"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "JIT creates users on first SSO login when enabled"
    source: "https://support.pandadoc.com/en/articles/9715050-sso-implementation"
    checked: "2026-09-15"
  domain_verification:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "DNS TXT record verification after SSO configuration"
    source: "https://support.pandadoc.com/en/articles/9715050-sso-implementation"
    checked: "2026-09-15"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "supported"
    notes: "SCIM 2.0 group-based provisioning maps IdP group membership to role, license and workspace; plan requirement not stated"
    source: "https://support.pandadoc.com/en/articles/9715050-sso-implementation"
    checked: "2026-09-15"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
