name: "Railway"
category: "infrastructure"
website: "https://railway.com"
description: "Railway is a cloud platform for deploying apps, databases and services."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    protocols: ["SAML", "OIDC"]
    notes: "SAML SSO works with any identity provider that supports SAML or OIDC, on Enterprise workspaces."
    source: "https://docs.railway.com/enterprise/saml"
    checked: "2026-09-27"
  sso_enforcement:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Admins can require members to log in with SAML SSO to access the workspace, but users can still use other login methods for the rest of their account."
    source: "https://docs.railway.com/enterprise/saml"
    checked: "2026-09-27"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Pro"
    notes: "Workspace admins can require two-factor authentication for all members on Pro and above. API tokens keep working without 2FA."
    source: "https://docs.railway.com/access/two-factor-enforcement"
    checked: "2026-09-27"
  phishing_resistant_mfa:
    support: "supported"
    notes: "Users can register passkeys as a second factor."
    source: "https://docs.railway.com/access/multi-factor-authentication"
    checked: "2026-09-27"
  audit_logs:
    support: "supported"
    tier: "free"
    plan: "Free"
    retention: "48 hours on Free, Trial and Hobby; 30 days on Pro; 18 months on Enterprise"
    notes: "Workspace admins can view audit logs, and retention depends on the plan."
    source: "https://docs.railway.com/enterprise/audit-logs"
    checked: "2026-09-27"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "New users who sign in through your identity provider are added to the workspace as members automatically."
    source: "https://docs.railway.com/enterprise/saml"
    checked: "2026-09-27"
  domain_verification:
    support: "partial"
    notes: "Trusted Domains are verified through a custom domain on a Railway service, and new sign-ups with that email domain join the workspace with a set role. The docs don't mention taking control of existing accounts."
    source: "https://docs.railway.com/projects/workspaces#trusted-domains"
    checked: "2026-09-27"
  custom_roles:
    support: "undocumented"
    notes: "The docs list fixed workspace roles (Admin, Member, Deployer). Access groups combine people and projects with a fixed project role."
  group_role_mapping:
    support: "undocumented"
    notes: "Access groups are managed in Railway, and the docs don't mention syncing them from identity provider groups."
  session_controls:
    support: "undocumented"
    notes: "Users can see and revoke their own sessions, but the docs don't describe admin controls."
  api_token_controls:
    support: "undocumented"
