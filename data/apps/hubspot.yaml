name: "HubSpot"
category: "sales_marketing"
website: "https://hubspot.com"
description: "Customer platform with software for marketing, sales, content management, and service."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "Professional or Enterprise tier of any Hub"
    protocols: ["SAML"]
    source: "https://knowledge.hubspot.com/account/can-i-use-single-sign-on-sso-with-hubspot"
    checked: "2026-09-14"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "Require single sign-on is on by default; Super Admins can exclude specific users"
    source: "https://knowledge.hubspot.com/account/can-i-use-single-sign-on-sso-with-hubspot"
    checked: "2026-09-14"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "Creates, updates and deactivates users; Okta roles can sync to permission sets; custom SCIM for Entra ID, PingFederate, OneLogin and JumpCloud"
    source: "https://knowledge.hubspot.com/account/provision-hubspot-users-with-scim-through-okta"
    checked: "2026-09-14"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    notes: "Always required for username/password logins on Starter and above; Super Admins can require it on free accounts; SSO logins aren't prompted"
    source: "https://knowledge.hubspot.com/account-security/set-up-two-factor-authentication-for-your-hubspot-login"
    checked: "2026-09-14"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    notes: "Passkey login on all plans; Super Admins can enforce passkeys as the login method"
    source: "https://knowledge.hubspot.com/account-management/set-up-and-log-in-with-passkeys"
    checked: "2026-09-14"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "Starter"
    notes: "Logins and security activity on Starter and above; Enterprise adds many more event types"
    source: "https://knowledge.hubspot.com/account-management/view-and-export-account-activity-history"
    checked: "2026-09-14"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    tier: "free"
    plan: "All products and plans"
    notes: "Super Admins set the idle session timeout (default 24 hours). Admins can't log out other users' sessions."
    source: "https://knowledge.hubspot.com/account-management/log-out-of-hubspot#customize-inactive-session-timeout"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
