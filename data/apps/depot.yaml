name: "Depot"
category: "development"
website: "https://depot.dev"
description: "Depot is a build acceleration platform for faster Docker image builds, GitHub Actions runners and remote build caching."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "add_on"
    plan: "SSO add-on"
    notes: "Single sign-on with SCIM provisioning is an add-on feature; you configure your identity provider once in the Depot dashboard. The docs don't name the protocols."
    source: "https://depot.dev/docs/account"
    checked: "2026-09-27"
  sso_enforcement:
    support: "undocumented"
    notes: "The account docs don't say whether SSO can be made mandatory for all members."
  scim:
    support: "supported"
    tier: "add_on"
    plan: "SSO add-on"
    notes: "SSO comes with SCIM provisioning as an add-on, and the identity provider handles organization members."
    source: "https://depot.dev/docs/account"
    checked: "2026-09-27"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "undocumented"
    notes: "The docs list only two built-in roles, Owner and Member, and say more roles may come later."
  group_role_mapping:
    support: "undocumented"
  session_controls:
    support: "undocumented"
  api_token_controls:
    support: "undocumented"
    notes: "Owners can create and remove organization API tokens, but the docs don't say whether admins can see or revoke tokens that users create."
