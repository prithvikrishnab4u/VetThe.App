name: "Coursera for Business"
category: "productivity"
website: "https://www.coursera.org/business"
description: "Enterprise learning platform for skills development."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    protocols: ["SAML", "OIDC"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "unknown"
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "unknown"
  jit_provisioning:
    support: "supported"
  domain_verification:
    support: "supported"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
