name: "Vanta"
category: "security"
website: "https://www.vanta.com"
description: "Vanta is a trust management and compliance automation platform that helps companies achieve and maintain security certifications like SOC 2, ISO 27001, and HIPAA."
status: "draft"

capabilities:
  sso:
    support: "supported"
    protocols: ["SAML"]
    notes: "Supports SAML SSO via IdP integrations (Okta, custom SAML connections) or standalone SSO for Vanta login."
    source: "https://help.vanta.com/en/articles/11345649-creating-a-custom-saml-connection"
    checked: "2026-09-22"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "add_on"
    notes: "SCIM provisioning/deprovisioning via IdP (e.g. Okta) may require an upgrade or add-on per Vanta pricing."
    source: "https://help.vanta.com/en/articles/11345647-enabling-scim-in-vanta"
    checked: "2026-09-22"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "There is an auto-provision employee portal accounts setting, but it needs the IdP configured as a personnel source first, so it is unclear whether it fires on first login or on sync. Needs a browser check."
  domain_verification:
    support: "undocumented"
    notes: "The domain features found are Trust Center custom domains and domain matching for portal viewers, not verifying a domain to claim Vanta logins."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
