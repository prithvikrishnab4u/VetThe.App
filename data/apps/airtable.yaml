name: "Airtable"
category: "productivity"
website: "https://airtable.com"
description: "A platform for building collaborative apps and databases with powerful automation."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Business"
    protocols: ["SAML"]
    source: "https://support.airtable.com/articles/8571088137-configuring-sso-in-the-admin-panel"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "Admins can set the SSO login requirement to required for all users in a verified domain."
    source: "https://support.airtable.com/articles/9656884884-settings-airtable-admin-panel"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "SCIM creates, updates and deactivates users; SSO is a prerequisite."
    source: "https://support.airtable.com/articles/1437991116-managing-users-via-idp-sync"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise Scale"
    notes: "Admins can require 2FA for enterprise members or all users accessing enterprise content."
    source: "https://support.airtable.com/articles/9656884884-settings-airtable-admin-panel"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise Scale"
    retention: "180 days"
    source: "https://support.airtable.com/articles/1665450173-accessing-enterprise-audit-logs-in-airtable"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Business"
    source: "https://support.airtable.com/articles/8571088137-configuring-sso-in-the-admin-panel"
    checked: "2026-09-16"
  domain_verification:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "Admins verify domains, giving control over the associated user accounts."
    source: "https://support.airtable.com/articles/9656884884-settings-airtable-admin-panel"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "Admins set a fixed web session length from 4 hours to 1 year."
    source: "https://support.airtable.com/articles/9656884884-settings-airtable-admin-panel"
    checked: "2026-09-16"
  api_token_controls:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise Scale"
    notes: "Admins can block API access to organization-owned bases and workspaces, but per-token revocation is not described."
    source: "https://support.airtable.com/articles/9656884884-settings-airtable-admin-panel"
    checked: "2026-09-16"
