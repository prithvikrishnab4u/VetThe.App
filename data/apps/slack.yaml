name: "Slack"
category: "collaboration"
website: "https://slack.com"
description: "A messaging platform for teams that integrates with numerous tools and services."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Business+"
    notes: "Also on Free and Pro when a Salesforce org is connected to Slack"
    protocols: ["SAML"]
    source: "https://slack.com/help/articles/203772216-Set-up-SAML-single-sign-on-for-Slack"
    checked: "2026-09-14"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Business+"
    notes: "SSO can be required for all members, or for all members except guests"
    source: "https://slack.com/help/articles/203772216-Set-up-SAML-single-sign-on-for-Slack"
    checked: "2026-09-14"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Business+"
    notes: "Creates and deactivates members, syncs profile fields and user groups"
    source: "https://slack.com/help/articles/212572638-Manage-members-with-SCIM-provisioning"
    checked: "2026-09-14"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    notes: "With SSO on, only owners and admins who can bypass SSO must use 2FA"
    source: "https://slack.com/help/articles/212221668-Mandatory-workspace-two-factor-authentication"
    checked: "2026-09-14"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "View in Slack, export CSV/JSON, or use the Audit Logs API"
    source: "https://slack.com/help/articles/360000394286-Audit-logs-in-Slack"
    checked: "2026-09-14"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Business+"
    notes: "Custom SAML SSO supports Just In Time provisioning."
    source: "https://slack.com/help/articles/205168057-Custom-SAML-single-sign-on"
    checked: "2026-09-16"
  domain_verification:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Domains are claimed through Slack support and block unsanctioned workspaces on them; Pro and Business+ DNS verification only covers Slack Connect."
    source: "https://slack.com/help/articles/115001379947-Claim-domains-on-Enterprise-Grid"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Admins set session duration for desktop and mobile. Enterprise can also set it for subsets of users."
    source: "https://slack.com/help/articles/115005223763-Manage-session-duration-"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
