name: "Shopify"
category: "sales_marketing"
website: "https://www.shopify.com"
description: "E-commerce platform for businesses of all sizes to sell online, in-store, and everywhere in between."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Shopify Plus"
    notes: "SAML authentication for organization users; auto-config for Okta, OneLogin and Entra"
    protocols: ["SAML"]
    source: "https://help.shopify.com/en/manual/your-account/users/security/advanced-security-features/saml"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Shopify Plus"
    notes: "SAML setting can be Required for all domain users or set for specific users"
    source: "https://help.shopify.com/en/manual/your-account/users/security/advanced-security-features/saml"
    checked: "2026-09-15"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Shopify Plus"
    notes: "SCIM API token after domain verification and SAML setup; create, assign groups and deactivate users"
    source: "https://help.shopify.com/en/manual/your-account/users/security/advanced-security-features/scim"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Shopify Plus"
    notes: "Organization can require a secure sign-in method (passkey or two-step authentication) for all users; some user types exempt"
    source: "https://help.shopify.com/en/manual/organization-settings/security/two-step-authentication"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Passkey login is an account-level feature for logging into Shopify, not gated by store subscription plan."
    source: "https://help.shopify.com/en/manual/your-account/logging-in/passkeys"
    checked: "2026-09-16"
  audit_logs:
    support: "partial"
    notes: "User management activity log and last five login sessions per user; retention and export not stated; plan requirement not stated"
    source: "https://help.shopify.com/en/manual/your-account/users/security/user-management-activity-log"
    checked: "2026-09-15"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "supported"
    tier: "enterprise"
    plan: "Shopify Plus"
    notes: "Organization domain must be verified before enabling SAML"
    source: "https://help.shopify.com/en/manual/your-account/users/security/advanced-security-features/saml"
    checked: "2026-09-15"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "supported"
    tier: "enterprise"
    plan: "Shopify Plus"
    notes: "SCIM group assignment for Okta, OneLogin and Entra; IdP group names must match Shopify groups"
    source: "https://help.shopify.com/en/manual/your-account/users/security/advanced-security-features/scim"
    checked: "2026-09-15"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
