name: "Lever"
category: "hr"
website: "https://www.lever.co"
description: "Talent relationship management and applicant tracking system (LeverTRM) for recruiting."
status: "draft"

capabilities:
  sso:
    support: "supported"
    protocols: ["SAML"]
    notes: "Lever Help Center publishes SAML 2.0 integration setup guides for Okta, OneLogin and Microsoft Entra; required plan not stated in these pages."
    source: "https://help.lever.co/hc/en-us/articles/20087357055005-Enabling-a-SAML-integration-with-Okta"
    checked: "2026-09-22"
  sso_enforcement:
    support: "undocumented"
    notes: "No vendor documentation found on requiring SSO / disabling password login."
  scim:
    support: "undocumented"
    notes: "No SCIM or automated provisioning documentation found on help.lever.co."
  mfa_enforcement:
    support: "undocumented"
    notes: "No vendor documentation found on admin-enforced MFA within the Lever product itself."
  phishing_resistant_mfa:
    support: "undocumented"
    notes: "No mention of passkeys/WebAuthn/FIDO2."
  audit_logs:
    support: "undocumented"
    notes: "No customer-facing admin audit log documentation found; security page only describes Lever's internal SSO/MFA use for its own staff."
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
