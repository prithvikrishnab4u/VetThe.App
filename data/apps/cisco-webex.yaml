name: "Cisco Webex"
category: "collaboration"
website: "https://webex.com"
description: "Enterprise video conferencing, online meetings, and screen sharing platform with advanced security."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    protocols: ["SAML"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "unknown"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "supported"
    tier: "paid"
    retention: "360 days"
  jit_provisioning:
    support: "supported"
  domain_verification:
    support: "supported"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "supported"
  api_token_controls:
    support: "unknown"
