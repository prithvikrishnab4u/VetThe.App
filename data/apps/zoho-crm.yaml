name: "Zoho CRM"
category: "sales_marketing"
website: "https://www.zoho.com/crm"
description: "Online CRM software for managing sales, marketing, and support."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML SSO configured at Zoho Accounts organization level; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://help.zoho.com/portal/en/kb/accounts/manage-your-organization/saml/articles/configure-saml-in-zoho-accounts"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    notes: "Organization admins can enforce MFA and restrict allowed modes; plan requirement not stated"
    source: "https://help.zoho.com/portal/en/kb/accounts/multi-factor-authentication/articles/mfa-introduction"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "supported"
    notes: "FIDO U2F and FIDO2 security keys as MFA mode; plan requirement not stated"
    source: "https://help.zoho.com/portal/en/kb/accounts/multi-factor-authentication/articles/mfa-security-key"
    checked: "2026-09-15"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "Enterprise"
    retention: "3 years"
    notes: "Audit Log of record and setup actions, exportable; available from the Enterprise edition per Zoho CRM's edition comparison chart"
    source: "https://www.zoho.com/sites/default/files/crm/zohocrm-edition-comparison-usd.pdf"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    notes: "SAML JIT adds users to the Zoho organization on first sign-in after domain validation; plan requirement not stated"
    source: "https://help.zoho.com/portal/en/kb/accounts/manage-your-organization/saml/articles/configure-saml-in-zoho-accounts"
    checked: "2026-09-15"
  domain_verification:
    support: "undocumented"
    notes: "Zoho Accounts lets org admins verify domains by TXT/CNAME/HTML, but the docs do not say this takes control of accounts or which plan is needed."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
