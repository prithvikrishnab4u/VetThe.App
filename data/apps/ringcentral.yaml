name: "RingCentral"
category: "collaboration"
website: "https://www.ringcentral.com"
description: "Cloud-based communication and collaboration platform for businesses."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML 2.0 SSO configured in the Admin Portal; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://support.ringcentral.com/article-v2/1149.html?brand=RingCentral&product=RingEX&language=en_US"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "'Enforce SSO login only' blocks phone number and password sign-in; plan requirement not stated"
    source: "https://support.ringcentral.com/article-v2/1149.html?brand=RingCentral&product=RingEX&language=en_US"
    checked: "2026-09-15"
  scim:
    support: "unknown"
  mfa_enforcement:
    support: "supported"
    notes: "Super admins can set up MFA for all users or selected roles; authenticator app (TOTP); plan requirement not stated"
    source: "https://support.ringcentral.com/article-v2/Setting-up-multi-factor-authentication-MFA.html?brand=RingCentral&product=RingEX&language=en_US&pills-nav=users"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "All RingEX and Video Pro+ accounts"
    notes: "Audit Trail tracks Admin Portal configuration changes, failed logins and locked accounts; on by default"
    retention: "180 days"
    source: "https://support.ringcentral.com/article-v2/10268-Audit-Trail-Overview-Administrators-RingCentral.html?brand=RingCentral&product=RingEX&language=en_US"
    checked: "2026-09-15"
  jit_provisioning:
    support: "unknown"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
