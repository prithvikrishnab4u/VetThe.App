name: "CrowdStrike"
category: "security"
website: "https://www.crowdstrike.com"
description: "Cybersecurity technology company that provides cloud workload and endpoint security, threat intelligence, and cyberattack response services."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "Vendor API docs reference customer accounts with single sign-on enabled; public docs do not state the protocol or plan."
    source: "https://developer.crowdstrike.com/cac/terraform/provider/user-management/resources/user/"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Falcon Go"
    notes: "2FA/MFA is required for every Falcon console login with a password."
    source: "https://go.crowdstrike.com/buy-falcon-customer-resources-mv.html"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "The JIT pages found are Falcon Identity Protection's privileged access feature for the customer's own environment, not provisioning of Falcon console users."
  domain_verification:
    support: "undocumented"
    notes: "The domain pages found cover spoofing and typosquatting protection, not claiming Falcon console accounts."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
