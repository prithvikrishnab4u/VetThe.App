    support: "supported"
    tier: "paid"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "unknown"
  jit_provisioning:
    support: "not_supported"
  domain_verification:
    support: "not_supported"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
