name: "Microsoft Dynamics 365"
category: "sales_marketing"
website: "https://dynamics.microsoft.com"
description: "A suite of cloud-based ERP and CRM business applications from Microsoft, including Sales, Customer Service, and Finance."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "free"
    protocols: ["SAML", "OIDC"]
    notes: "Dynamics 365 apps are Microsoft Entra ID (Azure AD) enterprise applications; sign-in is exclusively via Microsoft Entra ID, which supports SAML and OpenID Connect, included with the underlying tenant at no extra cost."
    source: "https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/add-application-portal-setup-sso"
    checked: "2026-09-22"
  sso_enforcement:
    support: "supported"
    tier: "free"
    notes: "Dynamics 365 has no separate local password; all sign-in goes through the organization's Microsoft Entra ID tenant, so SSO is inherently required rather than optional."
    source: "https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/add-application-portal-setup-sso"
    checked: "2026-09-22"
  scim:
    support: "undocumented"
    notes: "User access is granted via Microsoft Entra ID/Microsoft 365 license and security-role assignment rather than a documented SCIM endpoint for Dynamics 365 itself."
  mfa_enforcement:
    support: "supported"
    tier: "add_on"
    plan: "Microsoft Entra ID P1/P2 (Conditional Access)"
    notes: "Admins enforce MFA for Dynamics 365/Dataverse access using Microsoft Entra Conditional Access policies, which require Entra ID P1 or P2 licensing."
    source: "https://learn.microsoft.com/en-us/entra/identity/conditional-access/policy-all-users-mfa-strength"
    checked: "2026-09-22"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    notes: "Microsoft Entra ID supports FIDO2 security keys, Windows Hello for Business, and passkeys as phishing-resistant sign-in methods for the tenant Dynamics 365 users sign in through, at no extra licensing cost."
    source: "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-passkeys-fido2"
    checked: "2026-09-22"
  audit_logs:
    support: "supported"
    tier: "free"
    retention: "Forever (default); configurable up to 24,855 days"
    notes: "Dataverse auditing logs record create/update/delete operations, security role changes, and user access (sign-in) with an admin-configurable retention period."
    source: "https://learn.microsoft.com/en-us/power-platform/admin/manage-dataverse-auditing"
    checked: "2026-09-22"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
