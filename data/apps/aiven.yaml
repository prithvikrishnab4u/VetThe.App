name: "Aiven"
category: "infrastructure"
website: "https://aiven.io"
description: "Aiven is a managed cloud data platform for running open-source databases, streaming, and search services."
status: "draft"

capabilities:
  sso:
    support: "supported"
    protocols: ["SAML"]
    notes: "Organization admins can add SAML identity providers. Each one has to be linked to a verified domain. The docs don't name a plan."
    source: "https://aiven.io/docs/platform/howto/saml/add-identity-providers"
    checked: "2026-09-27"
  sso_enforcement:
    support: "supported"
    notes: "The authentication policy sets which login methods are allowed. Admins can turn off password and third-party login and require your own organization's IdP."
    source: "https://aiven.io/docs/platform/howto/set-authentication-policies"
    checked: "2026-09-27"
  scim:
    support: "partial"
    notes: "SCIM provisioning is documented for Okta only. It can create, update, and deactivate users and push groups."
    source: "https://aiven.io/docs/platform/howto/saml/add-okta-idp"
    checked: "2026-09-27"
  mfa_enforcement:
    support: "partial"
    notes: "Admins can require 2FA for everyone, but only for email and password logins. Aiven can't enforce 2FA on logins through third-party providers or IdPs."
    source: "https://aiven.io/docs/platform/howto/set-authentication-policies"
    checked: "2026-09-27"
  phishing_resistant_mfa:
    support: "undocumented"
    notes: "The 2FA docs only describe TOTP authenticator apps."
  audit_logs:
    support: "supported"
    retention: "30 days"
    notes: "Organization event logs record the action, who did it, when, and the target resource. Logs are kept for 30 days."
    source: "https://aiven.io/docs/platform/howto/organization-event-logs"
    checked: "2026-09-27"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "supported"
    notes: "Domains are verified with a DNS TXT record or an uploaded HTML file. Users on a verified domain become managed users."
    source: "https://aiven.io/docs/platform/howto/manage-domains"
    checked: "2026-09-27"
  custom_roles:
    support: "undocumented"
    notes: "Individual permissions can be granted alongside the predefined roles, but the docs don't describe creating custom roles."
  group_role_mapping:
    support: "supported"
    notes: "With group syncing turned on, users' IdP group membership syncs to matching Aiven groups at login, and roles are granted to those groups."
    source: "https://aiven.io/docs/platform/howto/saml/add-identity-providers"
    checked: "2026-09-27"
  session_controls:
    support: "undocumented"
    notes: "Admins can limit access to allowed IP ranges, but the docs don't describe an organization-wide session timeout."
  api_token_controls:
    support: "supported"
    notes: "Admins can stop users from creating personal tokens and require that tokens were made with an allowed login method. IP allowlists also apply to tokens. Each token gets its own session duration."
    source: "https://aiven.io/docs/platform/howto/set-authentication-policies"
    checked: "2026-09-27"
