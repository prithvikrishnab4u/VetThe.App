name: "New Relic"
category: "infrastructure"
website: "https://newrelic.com"
description: "Observability platform that helps you build better software."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Paid edition"
    notes: "SAML 2.0 SSO per authentication domain; signed assertions required"
    protocols: ["SAML"]
    source: "https://docs.newrelic.com/docs/accounts/accounts-billing/new-relic-one-user-management/authentication-domains-saml-sso-scim-more/"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Paid edition"
    notes: "Each authentication domain has a single authentication method, so users in a SAML domain can't use password login"
    source: "https://docs.newrelic.com/docs/accounts/accounts-billing/new-relic-one-user-management/authentication-domains-saml-sso-scim-more/"
    checked: "2026-09-15"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Pro or Enterprise edition"
    notes: "SCIM automated user management per authentication domain"
    source: "https://docs.newrelic.com/docs/accounts/accounts-billing/new-relic-one-user-management/authentication-domains-saml-sso-scim-more/"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    notes: "MFA enabled per authentication domain; email verification code at each login plus backup codes; plan requirement not stated"
    source: "https://docs.newrelic.com/docs/accounts/accounts-billing/new-relic-one-user-management/authentication-domains-saml-sso-scim-more/"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "supported"
    tier: "free"
    plan: "All accounts"
    notes: "NrAuditEvent queryable via NRQL, including login and logout events; user, permission and login events are written only to the parent account"
    retention: "13 months"
    source: "https://docs.newrelic.com/docs/accounts/accounts/account-maintenance/query-account-audit-logs-nrauditevent/"
    checked: "2026-09-15"
  jit_provisioning:
    support: "unknown"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "supported"
    notes: "Per authentication domain: maximum session length and idle timeout; plan requirement not stated"
    source: "https://docs.newrelic.com/docs/accounts/accounts-billing/new-relic-one-user-management/authentication-domains-saml-sso-scim-more/"
    checked: "2026-09-15"
  api_token_controls:
    support: "unknown"
