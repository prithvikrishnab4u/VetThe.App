name: "CircleCI"
category: "development"
website: "https://circleci.com"
description: "Continuous integration and delivery platform for DevOps teams."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Scale"
    notes: "SAML 2.0 SSO per organization; one domain per organization"
    protocols: ["SAML"]
    source: "https://circleci.com/docs/guides/permissions-authentication/sso-overview/"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Scale"
    notes: "With SSO enabled, users accessing org resources without IdP authentication are redirected to the IdP; personal API tokens must be SSO-authorized for the org"
    source: "https://circleci.com/docs/guides/permissions-authentication/sso-overview/"
    checked: "2026-09-15"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Org admins request audit logs (30-day window per request; 1 request/day on Free, 3 on paid); streaming to S3 is Scale plan only"
    retention: "Up to 12 months"
    source: "https://circleci.com/docs/guides/security/audit-logs/"
    checked: "2026-09-15"
  jit_provisioning:
    support: "not_supported"
    notes: "Users need an existing CircleCI email/password account, and once SSO is enforced new members must be invited to the organization."
    source: "https://circleci.com/docs/guides/permissions-authentication/set-up-sso/"
    checked: "2026-09-16"
  domain_verification:
    support: "partial"
    tier: "enterprise"
    plan: "Scale"
    notes: "A DNS TXT record proves domain ownership before the SSO connection activates, but the docs don't say it lets the org claim accounts that use the domain."
    source: "https://circleci.com/docs/guides/permissions-authentication/set-up-sso/"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
