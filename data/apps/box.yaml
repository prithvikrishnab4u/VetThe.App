name: "Box"
category: "collaboration"
website: "https://box.com"
description: "Cloud content management and file sharing service for businesses."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "undocumented"
    notes: "All box.com domains were blocked from this network; nothing could be confirmed."
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    notes: "SSO On-the-Fly Registration provisions the account the first time a user logs in. SSO is on Business and Enterprise."
    source: "https://docs.box.com/en/box-admin-tools/box-security/setting-up-single-sign-on-sso-for-your-organization"
    checked: "2026-09-24"
  domain_verification:
    support: "supported"
    tier: "paid"
    notes: "Domain Management verifies a domain by DNS TXT record, and Auto Enrollment then claims users who sign up on it."
    source: "https://docs.box.com/en/box-admin-tools/how-to-guides-for-admins/domain-management-verification-and-auto-enrollment"
    checked: "2026-09-24"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
