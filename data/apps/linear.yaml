name: "Linear"
category: "development"
website: "https://linear.app"
description: "Project management tool for high-performance software teams."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Needs a domain claimed with a DNS TXT record"
    protocols: ["SAML"]
    source: "https://linear.app/docs/saml-and-access-control"
    checked: "2026-09-14"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Members on SAML-approved domains must sign in with SAML by default"
    source: "https://linear.app/docs/saml-and-access-control"
    checked: "2026-09-14"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Creates, updates and suspends users; supports group push"
    source: "https://linear.app/docs/scim"
    checked: "2026-09-14"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "Free"
    notes: "Passkeys are a login method; the docs page lists login restrictions as Business/Enterprise and SAML/IP restrictions as Enterprise-only but does not call out any plan restriction for passkeys, indicating availability on all plans including Free."
    source: "https://linear.app/docs/login-methods"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Filter in the app, query through the GraphQL API, or stream to a webhook for SIEM"
    retention: "90 days"
    source: "https://linear.app/docs/audit-log"
    checked: "2026-09-14"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Creates the account from IdP data on first SAML sign-in"
    source: "https://linear.app/docs/saml-and-access-control"
    checked: "2026-09-14"
  domain_verification:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Domains are claimed with a DNS TXT record as part of SAML setup"
    source: "https://linear.app/docs/saml-and-access-control"
    checked: "2026-09-14"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SCIM groups map to teams; linear-owners, linear-admins and linear-guests groups set roles"
    source: "https://linear.app/docs/scim"
    checked: "2026-09-14"
  session_controls:
    support: "undocumented"
    notes: "Docs only cover users revoking their own sessions. Nothing on admin-set session length or revoking members' sessions."
  api_token_controls:
    support: "not_researched"
