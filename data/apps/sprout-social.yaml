name: "Sprout Social"
category: "sales_marketing"
website: "https://sproutsocial.com"
description: "Social media management platform for businesses."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML 2.0 single sign-on across web and mobile. Plan requirement not stated."
    protocols: ["SAML"]
    source: "https://sproutsocial.com/security/sprout-social-application/"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    notes: "Two-step verification by email is enforced by default; TOTP and HOTP are available as alternatives. Plan requirement not stated."
    source: "https://sproutsocial.com/security/sprout-social-application/"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Over fifty events and actions are logged in the audit trail with the user who performed them. Retention and plan requirement not stated."
    source: "https://sproutsocial.com/security/sprout-social-application/"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    notes: "Just-in-time provisioning is available with SAML 2.0 SSO. Plan requirement not stated."
    source: "https://sproutsocial.com/security/sprout-social-application/"
    checked: "2026-09-16"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
