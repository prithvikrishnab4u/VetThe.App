name: "Amazon Web Services (AWS)"
category: "infrastructure"
website: "https://aws.amazon.com"
description: "Comprehensive cloud computing platform offering over 200 fully featured services from data centers globally."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "IAM Identity Center federates external IdPs via SAML 2.0 for console, CLI and access portal; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html"
    checked: "2026-09-15"
  sso_enforcement:
    support: "unknown"
  scim:
    support: "supported"
    notes: "IAM Identity Center supports SCIM v2.0 user and group provisioning; tokens valid one year; plan requirement not stated"
    source: "https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    notes: "IAM policy can deny all actions unless signed in with MFA; root user MFA enforced for all account types; plan requirement not stated"
    source: "https://docs.aws.amazon.com/IAM/latest/UserGuide/tutorial_users-self-manage-mfa-and-creds.html"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "supported"
    notes: "Passkeys and FIDO security keys supported as MFA for root and IAM users; plan requirement not stated"
    source: "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html"
    checked: "2026-09-15"
  audit_logs:
    support: "supported"
    tier: "free"
    notes: "CloudTrail event history enabled by default with no charge; management events per Region; trails or CloudTrail Lake for longer retention"
    retention: "90 days (event history)"
    source: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html"
    checked: "2026-09-15"
  jit_provisioning:
    support: "unknown"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
