name: "Amazon Web Services (AWS)"
category: "infrastructure"
website: "https://aws.amazon.com"
description: "Comprehensive cloud computing platform offering over 200 fully featured services from data centers globally."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "free"
    protocols: ["SAML", "OIDC"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "unknown"
  mfa_enforcement:
    support: "supported"
    tier: "free"
  phishing_resistant_mfa:
    support: "supported"
  audit_logs:
    support: "unknown"
  jit_provisioning:
    support: "supported"
  domain_verification:
    support: "supported"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
