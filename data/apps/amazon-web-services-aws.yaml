name: "Amazon Web Services (AWS)"
category: "infrastructure"
website: "https://aws.amazon.com"
description: "Comprehensive cloud computing platform offering over 200 fully featured services from data centers globally."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "free"
    plan: "All AWS accounts"
    protocols: ["SAML"]
    notes: "IAM Identity Center federates external IdPs via SAML 2.0 for console, CLI and access portal; no additional charge"
    source: "https://aws.amazon.com/iam/identity-center/pricing/"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "free"
    plan: "All AWS accounts"
    notes: "IAM Identity Center supports SCIM v2.0 user and group provisioning; tokens valid one year; no additional charge"
    source: "https://aws.amazon.com/iam/identity-center/pricing/"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    plan: "All AWS accounts"
    notes: "IAM policy can deny all actions unless signed in with MFA; root user MFA enforced for all account types; no additional charge"
    source: "https://aws.amazon.com/iam/identity-center/pricing/"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "All AWS accounts"
    notes: "Passkeys and FIDO security keys supported as MFA for root and IAM users; no additional charge"
    source: "https://aws.amazon.com/iam/identity-center/pricing/"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "free"
    notes: "CloudTrail event history enabled by default with no charge; management events per Region; trails or CloudTrail Lake for longer retention"
    retention: "90 days (event history)"
    source: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html"
    checked: "2026-09-15"
  jit_provisioning:
    support: "not_supported"
    notes: "Users and groups from an external IdP must be provisioned via SCIM or manually before SAML sign-in; SAML does not create them."
    source: "https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-idp.html"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
    notes: "IAM Identity Center docs do not describe verifying an email domain."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
