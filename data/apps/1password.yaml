name: 1Password
category: security
website: https://1password.com
description: Password manager, digital vault, form filler and secure digital wallet.
status: draft
capabilities:
  sso:
    support: supported
    tier: paid
    plan: Business
    notes: Unlock with SSO uses OpenID Connect; people in the Owners group can't unlock
      with SSO
    protocols:
    - OIDC
    source: https://support.1password.com/sso/
    checked: '2026-09-14'
  sso_enforcement:
    support: supported
    tier: paid
    plan: Business
    notes: Apply to selected groups, everyone except excluded groups, or everyone
      except guests; Owners keep their account password; 1–30 day grace period
    source: https://support.1password.com/sso-configure-generic/
    checked: '2026-09-14'
  scim:
    support: supported
    tier: paid
    plan: Business
    notes: Creates users and groups, grants and revokes group access, suspends users;
      SCIM Bridge for Google Workspace and Rippling, direct provisioning for Entra
      ID, JumpCloud, Okta and OneLogin
    source: https://support.1password.com/scim/
    checked: '2026-09-14'
  mfa_enforcement:
    support: supported
    tier: paid
    plan: Business
    notes: Needs the Strict account password policy; applies to everyone in the organization
    source: https://support.1password.com/manage-two-factor-authentication/
    checked: '2026-09-14'
  phishing_resistant_mfa:
    support: supported
    notes: FIDO U2F security keys as a second factor; unlocking with a passkey is
      in beta
    source: https://support.1password.com/security-key/
    checked: '2026-09-14'
  audit_logs:
    support: supported
    tier: paid
    plan: Business
    notes: CSV export; Events Reporting and the Events API for SIEM
    retention: 365 days
    source: https://support.1password.com/activity-log/
    checked: '2026-09-14'
  jit_provisioning:
    support: unknown
  domain_verification:
    support: supported
  custom_roles:
    support: unknown
  group_role_mapping:
    support: supported
    tier: paid
    plan: Business
    notes: Groups synced from the directory grant and revoke access in 1Password
    source: https://support.1password.com/scim/
    checked: '2026-09-14'
  session_controls:
    support: unknown
  api_token_controls:
    support: unknown
provenance:
  source: auto-scan
  source_url: https://1password.com
  verified_by: auto-scan
  checked: '2026-09-14'
  evidence: sso,scim,mfa,soc2,iso27001
