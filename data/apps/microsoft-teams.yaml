name: "Microsoft Teams"
category: "collaboration"
website: "https://www.microsoft.com/en-us/microsoft-teams"
description: "The hub for teamwork in Microsoft 365 that combines chat, meetings, calling, and collaboration."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "Teams uses Microsoft 365 identity models in Entra ID, including hybrid identity with a federated IdP such as AD FS; plan requirement not stated"
    source: "https://learn.microsoft.com/en-us/microsoftteams/identify-models-authentication"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Any Microsoft 365 or Office 365 plan that includes Teams"
    notes: "Entra ID control, not a Teams setting; Microsoft recommends requiring MFA at least for admin roles"
    source: "https://learn.microsoft.com/en-us/microsoftteams/identify-models-authentication"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "Microsoft Entra ID Free"
    notes: "Entra ID control: passkeys (FIDO2) in all Entra editions; requiring them via Conditional Access authentication strength needs Entra ID P1"
    source: "https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-enable-passkey-fido2"
    checked: "2026-09-15"
  audit_logs:
    support: "supported"
    notes: "Teams activities (teams, channels, settings) recorded in the Microsoft Purview audit log; retention depends on the M365 subscription and user license, plan requirement not stated"
    source: "https://learn.microsoft.com/en-us/purview/audit-teams-audit-log-events"
    checked: "2026-09-15"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "supported"
    tier: "paid"
    plan: "Microsoft 365 Business"
    notes: "Custom domains are verified with a DNS TXT record in the Microsoft 365 admin center."
    source: "https://learn.microsoft.com/en-us/microsoft-365/admin/setup/add-domain"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
