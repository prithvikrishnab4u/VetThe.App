name: "DocuSign"
category: "productivity"
website: "https://docusign.com"
description: "Electronic signature and agreement management platform."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "add_on"
    plan: "Access Management with SSO"
    notes: "SSO via Docusign Admin with Access Management with SSO or Organization Management; included in eSignature Enterprise Pro"
    source: "https://www.docusign.com/products/admin"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "add_on"
    plan: "Organization Management"
    notes: "SCIM provisioning and deprovisioning included in Organization Management"
    source: "https://www.docusign.com/products/admin"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "supported"
    tier: "add_on"
    plan: "Access Management with SSO"
    notes: "Users signing in with a reserved-domain email are created in the org's default account (or a SAML-specified account); requires the Access Management with SSO add-on."
    source: "https://support.docusign.com/s/document-item?language=en_US&bundleId=rrf1583359212854&topicId=ybc1583359179365.html&_LANG=enus"
    checked: "2026-09-16"
  domain_verification:
    support: "supported"
    tier: "add_on"
    notes: "Domain claiming in Docusign Admin; admin capabilities are IAM plans or eSignature add-ons; exact plan not stated"
    source: "https://www.docusign.com/products/admin"
    checked: "2026-09-15"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
