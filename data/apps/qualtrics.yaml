name: "Qualtrics"
category: "sales_marketing"
website: "https://www.qualtrics.com"
description: "Experience management platform for collecting and analyzing data."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "add_on"
    notes: "Brand administrators connect any identity provider meeting the SAML technical requirements. Qualtrics states SSO is a paid feature and licenses must be checked with an account executive, so no plan name is given."
    protocols: ["SAML"]
    source: "https://www.qualtrics.com/support/survey-platform/sp-administration/brand-customization-services/sso/single-sign-on/"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "add_on"
    notes: "Disabling the Qualtrics Login connection requires all users to log in through SSO and removes username and password login."
    source: "https://www.qualtrics.com/support/survey-platform/sp-administration/brand-customization-services/sso/configuring-organization-sso-settings/"
    checked: "2026-09-16"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    notes: "Brand administrators can enable two-factor authentication for the Qualtrics login type; it does not apply to participant user types. Plan requirement not stated."
    source: "https://www.qualtrics.com/support/survey-platform/sp-administration/organization-settings/"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Security tab Activity Logs record actions across the organization including regular, proxy, SSO and failed logins, session and password events, with username, IP address and timestamp. Retention and plan requirement not stated."
    source: "https://www.qualtrics.com/support/survey-platform/sp-administration/security-tab/"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    notes: "Just-in-time user provisioning creates accounts when users authenticate through SSO without an existing account in the brand. Plan requirement not stated."
    source: "https://www.qualtrics.com/support/survey-platform/sp-administration/brand-customization-services/sso/managing-users-brands-with-sso/"
    checked: "2026-09-16"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "partial"
    notes: "SSO attributes can be mapped to assign users to Groups and permissions, but CAS and Google OAuth 2.0 cannot pass the extra attributes. Plan requirement not stated."
    source: "https://www.qualtrics.com/support/survey-platform/sp-administration/brand-customization-services/sso/managing-users-brands-with-sso/"
    checked: "2026-09-16"
  session_controls:
    support: "supported"
    notes: "Security tab sets minutes of inactivity until automatic logout (default 60), maximum concurrent sessions per user, account lockout thresholds, and lets admins force logout of active sessions. Plan requirement not stated."
    source: "https://www.qualtrics.com/support/survey-platform/sp-administration/security-tab/"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
