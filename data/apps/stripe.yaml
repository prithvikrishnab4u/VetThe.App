name: "Stripe"
category: "finance"
website: "https://stripe.com"
description: "Financial infrastructure platform for the internet."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    protocols: ["SAML"]
    notes: "Dashboard SSO for any SAML 2.0 IdP; Stripe accounts have no subscription tiers (pay-per-transaction pricing) and the docs state no plan gate; can be configured centrally for an organization"
    source: "https://docs.stripe.com/get-started/account/sso"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "Enforcement mode Off, Optional or Required; no plan gate documented; the account owner's access can't be revoked"
    source: "https://docs.stripe.com/get-started/account/sso/other"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "Needs SSO; creates, updates and deprovisions users and groups; no plan gate documented; deactivating a user deletes them; email and group name updates aren't supported"
    source: "https://docs.stripe.com/get-started/account/sso/scim"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "Team administrators can require two-step authentication for everyone on the Team settings page; no plan gate documented"
    source: "https://support.stripe.com/questions/enable-two-step-authentication"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "Passkeys and hardware security keys; no plan gate documented"
    source: "https://support.stripe.com/questions/enable-two-step-authentication"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    retention: "6 months"
    notes: "Security history in the Dashboard with export; Activity Logs API (public preview) covers API keys, invitations and role changes; access requires only a secret key with the Activity logs permission, no plan gate documented"
    source: "https://docs.stripe.com/activity-logs"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "Creates accounts for new users on their first SSO sign-in; no plan gate documented"
    source: "https://docs.stripe.com/get-started/account/sso"
    checked: "2026-09-16"
  domain_verification:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "DNS TXT record for each email domain, required to set up SSO; no plan gate documented"
    source: "https://docs.stripe.com/get-started/account/sso/other"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "Assign Dashboard roles to SCIM-synced groups, or send roles in SAML attribute statements; no plan gate documented"
    source: "https://docs.stripe.com/get-started/account/sso/group-role-assignments?locale=en-GB"
    checked: "2026-09-16"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "supported"
    tier: "free"
    plan: "Any Stripe account"
    notes: "Restricted API keys with limited permissions and access policies that block use from unauthorized locations; no plan gate documented"
    source: "https://docs.stripe.com/security"
    checked: "2026-09-16"
