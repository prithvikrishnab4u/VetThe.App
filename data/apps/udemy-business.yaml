name: "Udemy Business"
category: "productivity"
website: "https://business.udemy.com"
description: "Enterprise learning platform offering courses for professional development."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    protocols: ["SAML", "OIDC"]
    source: "https://business-support.udemy.com/hc/en-us/articles/38792420345367-How-to-configure-SSO-in-Okta-for-Udemy-Business-standard-experience"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "The 'Log in via SSO Provider only' setting forces all users to sign in via SSO."
    source: "https://business-support.udemy.com/hc/en-us/articles/38792614019095-Overview-of-Udemy-Business-SSO-core-features-standard-experience"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Provisions, updates, deactivates users and manages groups; cannot manage roles."
    source: "https://business-support.udemy.com/hc/en-us/articles/360035200594-Automating-user-and-group-management-with-SCIM"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    notes: "Admins toggle MFA for the whole organization; unavailable when SSO is forced. Plan not stated."
    source: "https://business-support.udemy.com/hc/en-us/articles/32953860178967-How-to-enable-multi-factor-authentication-for-your-organization"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "partial"
    notes: "Only a Group Membership Log of group adds and removals is documented."
    source: "https://business-support.udemy.com/hc/en-us/articles/360052222154-How-to-Access-And-Review-The-Group-Membership-Log"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    source: "https://business-support.udemy.com/hc/en-us/articles/38792614019095-Overview-of-Udemy-Business-SSO-core-features-standard-experience"
    checked: "2026-09-16"
  domain_verification:
    support: "not_supported"
    notes: "Approved email domains allow self-serve joining without DNS proof."
    source: "https://business-support.udemy.com/hc/en-us/articles/360022594313-Using-approved-email-domains-to-give-users-self-serve-access-to-Udemy-Business"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SAML groups attribute assigns users to existing Udemy groups; roles cannot be managed this way."
    source: "https://business-support.udemy.com/hc/en-us/articles/38792614019095-Overview-of-Udemy-Business-SSO-core-features-standard-experience"
    checked: "2026-09-16"
  session_controls:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SSO optional settings include an inactivity session timeout."
    source: "https://business-support.udemy.com/hc/en-us/articles/38792614019095-Overview-of-Udemy-Business-SSO-core-features-standard-experience"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
