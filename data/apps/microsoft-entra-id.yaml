name: "Microsoft Entra ID"
category: "security"
website: "https://www.microsoft.com/en-us/security/business/identity-access/microsoft-entra-id"
description: "Microsoft's cloud-based identity and access management platform providing single sign-on, MFA, and conditional access for apps and resources."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "free"
    plan: "Microsoft Entra ID Free"
    protocols: ["SAML", "OIDC"]
    notes: "Free edition includes unlimited SSO across any SaaS app."
    source: "https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing"
    checked: "2026-09-22"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    notes: "Automates provisioning and deprovisioning of users into SaaS apps via SCIM 2.0."
    source: "https://learn.microsoft.com/en-us/entra/identity/app-provisioning/user-provisioning"
    checked: "2026-09-22"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    plan: "Microsoft Entra ID Free"
    notes: "Free edition supports multifactor authentication (e.g. via security defaults)."
    source: "https://www.microsoft.com/en-us/security/business/microsoft-entra-pricing"
    checked: "2026-09-22"
  phishing_resistant_mfa:
    support: "supported"
    notes: "Supports passkeys (FIDO2), including device-bound security keys and synced passkeys."
    source: "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-passwordless"
    checked: "2026-09-22"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "not_supported"
    notes: "For a federated domain the account must already exist in the tenant. Sign-in fails with AADSTS50020 if it does not. This is about Entra's own directory users, not what Entra provisions into other apps."
    source: "https://learn.microsoft.com/en-us/troubleshoot/entra/entra-id/app-integration/error-code-aadsts50020-user-account-identity-provider-does-not-exist"
    checked: "2026-09-24"
  domain_verification:
    support: "supported"
    tier: "free"
    notes: "Admin takeover: verifying DNS ownership of a domain used by an unmanaged tenant moves its users, subscriptions and licences into the managed tenant. Built in, no separate plan."
    source: "https://learn.microsoft.com/en-us/entra/identity/users/domains-admin-takeover"
    checked: "2026-09-24"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
