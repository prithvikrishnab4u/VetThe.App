name: "Notion"
category: "productivity"
website: "https://notion.so"
description: "An all-in-one workspace for notes, tasks, wikis, and databases."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "Requires at least one verified domain"
    protocols: ["SAML"]
    source: "https://www.notion.com/help/saml-sso-configuration"
    checked: "2026-09-14"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "\"Only SAML SSO\" login method requires members to sign in with SAML"
    source: "https://www.notion.com/help/saml-sso-configuration"
    checked: "2026-09-14"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Creates, updates and removes users; manages groups"
    source: "https://www.notion.com/help/provision-users-and-groups-with-scim"
    checked: "2026-09-14"
  mfa_enforcement:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Organization owners can require MFA for guests only, not workspace members"
    source: "https://www.notion.com/help/mfa-enforcement"
    checked: "2026-09-14"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "In-app view, CSV export, and SIEM streaming"
    retention: "365 days"
    source: "https://www.notion.com/help/audit-log"
    checked: "2026-09-14"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "\"Automatic account creation\" when signing in with SAML SSO"
    source: "https://www.notion.com/help/saml-sso-configuration"
    checked: "2026-09-14"
  domain_verification:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "Workspace owners verify domains; required to turn on SAML SSO"
    source: "https://www.notion.com/help/saml-sso-configuration"
    checked: "2026-09-14"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Workspace owners set session duration from 1 hour to 180 days."
    source: "https://www.notion.com/help/managed-users-dashboard"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
