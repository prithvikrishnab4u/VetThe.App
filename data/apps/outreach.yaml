name: "Outreach"
category: "sales_marketing"
website: "https://www.outreach.io"
description: "Sales execution platform helping teams create and close more pipeline."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML SSO with Okta, Salesforce, OneLogin and other SAML IdPs; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://support.outreach.io/hc/en-us/articles/115001156694-Setting-up-other-SAML-IdP-SSO"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "Once enabled, SSO becomes the only way to access the org's seats; plan requirement not stated"
    source: "https://support.outreach.io/support/solutions/articles/159000426332-outreach-single-sign-on-sso-faq"
    checked: "2026-09-15"
  scim:
    support: "supported"
    notes: "SCIM 2.0 API via OAuth for users and teams, documented as beta; plan requirement not stated"
    source: "https://support.outreach.io/support/solutions/articles/159000426344-outreach-scim-protocol"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "supported"
    notes: "Advanced SSO setting to enable just-in-time new user provision; plan requirement not stated"
    source: "https://support.outreach.io/hc/en-us/articles/115001156694-Setting-up-other-SAML-IdP-SSO"
    checked: "2026-09-15"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
