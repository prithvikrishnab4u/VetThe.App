name: "Okta Workforce Identity"
category: "security"
website: "https://okta.com"
description: "Okta Workforce Identity is an identity and access management platform providing SSO, MFA, and lifecycle management for enterprises."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Starter"
    protocols: ["SAML", "OIDC"]
    source: "https://okta.com/pricing/"
    checked: "2026-09-22"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Essentials (Lifecycle Management)"
    notes: "SCIM-based automated provisioning/deprovisioning via Lifecycle Management, included from the Essentials tier."
    source: "https://okta.com/products/lifecycle-management/"
    checked: "2026-09-22"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Starter"
    source: "https://okta.com/pricing/"
    checked: "2026-09-22"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "supported"
    notes: "Inbound SAML IdP setup offers Create new user (JIT) with a just-in-time provisioning toggle, creating Okta accounts on first sign-in from an external IdP. This is Okta's own users, not what it provisions elsewhere. No plan is named."
    source: "https://help.okta.com/en-us/content/topics/security/idp-add-saml.htm"
    checked: "2026-09-24"
  domain_verification:
    support: "undocumented"
    notes: "Okta's domain verification covers custom email and URL domains, which is branding. No page addresses claiming existing accounts on a domain, either to confirm or rule it out."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
