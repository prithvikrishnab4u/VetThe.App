name: "Shortcut"
category: "development"
website: "https://www.shortcut.com"
description: "Project management platform designed for software development teams to unify planning and development."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Pricing lists Single sign-on (SSO) on Enterprise ('Contact our Support Team for details'); protocol not stated on page"
    source: "https://www.shortcut.com/pricing/"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "add_on"
    plan: "Business (add-on); included in Enterprise"
    notes: "SCIM for customers using SAML SSO and Okta"
    source: "https://www.shortcut.com/pricing/"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "not_supported"
    notes: "Users must already have a Shortcut account (invite, domain auto-join, or Okta SCIM) before signing in with SSO."
    source: "https://www.shortcut.com/help/admin/saml-sso-single-sign-on/"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
