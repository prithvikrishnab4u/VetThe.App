name: "Grammarly"
category: "productivity"
website: "https://www.grammarly.com"
description: "AI-powered writing assistant that helps individuals and teams communicate effectively."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "Included in Grammarly Business, Enterprise and Grammarly for Education plans."
    protocols: ["SAML"]
    source: "https://support.grammarly.com/hc/en-us/articles/360048683092-Set-up-SAML-single-sign-on"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Assigning the app in the IdP creates the member account; unassigning deactivates the account and invalidates sessions. Group provisioning available on request."
    source: "https://support.grammarly.com/hc/en-us/articles/4403054674829-Configure-SCIM-provisioning"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "A user without an existing Grammarly account has one created when they sign in via SSO."
    source: "https://support.grammarly.com/hc/en-us/articles/360048683092-Set-up-SAML-single-sign-on"
    checked: "2026-09-16"
  domain_verification:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Verified domains route signups to SSO and domain capture moves existing users onto the license; enabled via Customer Success Manager."
    source: "https://support.grammarly.com/hc/en-us/articles/33885668963469-Enterprise-domain-controls-for-new-signups-and-existing-users"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    tier: "enterprise"
    plan: "Grammarly Enterprise"
    notes: "Admins can set a re-authentication interval (e.g. 14/30 days). Session timeout is available only to Grammarly Enterprise and Grammarly for Education accounts, not Business."
    source: "https://support.grammarly.com/hc/en-us/articles/26230680413325-Session-Timeout-FAQs"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
