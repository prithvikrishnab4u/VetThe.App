name: "Snowflake"
category: "infrastructure"
website: "https://www.snowflake.com"
description: "Cloud-based data storage and analytics service known as the 'Data Cloud'."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (available on all editions)"
    protocols: ["SAML", "OIDC"]
    notes: "SAML 2.0 and OIDC security integrations; \"Federated authentication and SSO\" is listed as available across all Snowflake editions (Standard, Enterprise, Business Critical)"
    source: "https://docs.snowflake.com/en/user-guide/intro-editions"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (authentication policies are not edition-gated)"
    notes: "An authentication policy whose AUTHENTICATION_METHODS contains only SAML, set on the account or on specific users; no edition restriction documented"
    source: "https://docs.snowflake.com/en/user-guide/intro-editions"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (SCIM is not edition-gated)"
    notes: "Okta, Microsoft Entra ID and custom IdPs; creates, updates and disables users; no edition restriction documented in Snowflake's SCIM docs"
    source: "https://docs.snowflake.com/en/user-guide/scim-intro"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (available on all editions)"
    notes: "Authentication policy with MFA_ENROLLMENT = REQUIRED, for password and SSO users; no edition restriction documented"
    source: "https://docs.snowflake.com/en/user-guide/intro-editions"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (available on all editions)"
    notes: "Passkeys as a second factor; authentication policies can limit the allowed methods; no edition restriction documented"
    source: "https://docs.snowflake.com/en/user-guide/intro-editions"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (account_usage views available on all editions)"
    retention: "365 days"
    notes: "LOGIN_HISTORY view records successful and failed logins with authentication method; no edition restriction documented"
    source: "https://docs.snowflake.com/en/user-guide/intro-editions"
    checked: "2026-09-16"
  jit_provisioning:
    support: "undocumented"
    notes: "SAML docs expect users to already exist in Snowflake (created by hand or through SCIM)."
  domain_verification:
    support: "undocumented"
    notes: "No domain verification. ALLOWED_USER_DOMAINS on the SAML integration limits login domains but doesn't prove ownership."
  custom_roles:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (RBAC is not edition-gated)"
    notes: "Custom account roles and role hierarchies; no edition restriction documented"
    source: "https://docs.snowflake.com/en/user-guide/intro-editions"
    checked: "2026-09-16"
  group_role_mapping:
    support: "supported"
    tier: "paid"
    plan: "Standard edition (SCIM push groups are not edition-gated)"
    notes: "Okta Push Groups create Snowflake roles with the same names"
    source: "https://docs.snowflake.com/en/user-guide/scim-intro"
    checked: "2026-09-16"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
