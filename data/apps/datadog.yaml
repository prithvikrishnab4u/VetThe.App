name: "Datadog"
category: "infrastructure"
website: "https://www.datadoghq.com"
description: "Observability and security platform for cloud-scale applications, providing monitoring of servers, databases, tools, and services."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Pro"
    protocols: ["SAML"]
    notes: "SAML SSO is checked for Infrastructure Pro and Enterprise but not Free in Datadog's plan comparison table."
    source: "https://www.datadoghq.com/pricing/?product=infrastructure"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Pro"
    notes: "SAML Strict disables other login methods; admins can exempt individual users. It is a configuration option within SAML SSO, which is gated to Infrastructure Pro and Enterprise plans."
    source: "https://www.datadoghq.com/pricing/?product=infrastructure"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Infrastructure Pro"
    notes: "Also Infrastructure Enterprise and Startup plans; Entra ID and Okta only; creates and removes users and syncs Datadog Teams from IdP groups"
    source: "https://docs.datadoghq.com/account_management/scim/"
    checked: "2026-09-14"
  mfa_enforcement:
    support: "supported"
    notes: "Applies to email and password logins; SSO users get MFA from their IdP"
    source: "https://docs.datadoghq.com/account_management/multi-factor_authentication/"
    checked: "2026-09-14"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "add_on"
    plan: "Audit Trail"
    retention: "90 days"
    notes: "Audit Trail: CSV download of up to 100K events and archiving to S3, GCS or Azure; 7-day retention when Audit Trail is off. Datadog's Audit Trail FAQ confirms it is a separately purchased product regardless of other plan tier (\"Do I need to purchase other Datadog products to use Datadog Audit Trail? Yes.\")."
    source: "https://www.datadoghq.com/product/audit-trail/"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Pro"
    notes: "Creates the user on first SAML login; requires SAML SSO, which is gated to Infrastructure Pro and Enterprise plans."
    source: "https://www.datadoghq.com/pricing/?product=infrastructure"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
    notes: "SAML docs don't mention verifying or claiming a domain."
  custom_roles:
    support: "supported"
    notes: "Plan requirement not stated"
    source: "https://docs.datadoghq.com/account_management/rbac/"
    checked: "2026-09-14"
  group_role_mapping:
    support: "supported"
    notes: "SAML identity attributes map to default and custom roles"
    source: "https://docs.datadoghq.com/account_management/rbac/"
    checked: "2026-09-14"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
