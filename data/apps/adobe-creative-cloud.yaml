name: "Adobe Creative Cloud"
category: "productivity"
website: "https://www.adobe.com/creativecloud.html"
description: "A suite of 20+ apps and services for photography, design, video, web, UX, and more."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "Admin Console SSO requires Federated ID; Azure AD, Google or other SAML IdPs; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://experienceleague.adobe.com/en/docs/support-resources/adobe-support-tools-guide/adobe-admin-console/adobe-set-up-identity-and-sso"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Admin Console Insights audit log of org-level changes; also streamed via Adobe I/O Events"
    retention: "90 days"
    source: "https://experienceleague.adobe.com/en/docs/support-resources/adobe-support-tools-guide/adobe-admin-console/download-audit-logs-and-export-reports"
    checked: "2026-09-15"
  jit_provisioning:
    support: "undocumented"
    notes: "Adobe's helpx 'automatic account creation' pages for federated directories exist but blocked fetching (403), so this couldn't be confirmed."
  domain_verification:
    support: "supported"
    tier: "paid"
    plan: "Creative Cloud for teams"
    notes: "Enterprise ID and Federated ID need a claimed domain (DNS token), and the org gets exclusive rights to create accounts on verified domains."
    source: "https://experienceleague.adobe.com/en/docs/support-resources/adobe-support-tools-guide/adobe-admin-console/adobe-identity-overview"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
