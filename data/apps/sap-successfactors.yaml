name: "SAP SuccessFactors"
category: "hr"
website: "https://www.sap.com/products/hcm.html"
description: "SAP SuccessFactors is a cloud HCM/HXM suite covering core HR, payroll, recruiting, and talent management."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    protocols: ["SAML"]
    notes: "SuccessFactors is set up with SAP Cloud Identity Services - Identity Authentication as the IdP integration layer; SAML 2.0 is the recommended and most-used SSO protocol, with other SSO options also supported."
    source: "https://help.sap.com/docs/successfactors-platform/setting-up-sap-successfactors-with-identity-authentication-and-identity-provisioning-services/single-sign-on-for-sap-successfactors"
    checked: "2026-09-22"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    notes: "Docs describe SSO configured for all users of the system or a partial subset ('Partial SSO'), meaning full-user SSO (i.e., no password login path) is a supported configuration."
    source: "https://help.sap.com/docs/successfactors-platform/setting-up-sap-successfactors-with-identity-authentication-and-identity-provisioning-services/single-sign-on-for-sap-successfactors"
    checked: "2026-09-22"
  scim:
    support: "supported"
    tier: "enterprise"
    notes: "SAP Cloud Identity Services - Identity Provisioning integrates with SuccessFactors via a SCIM API/connector to automate user identity lifecycle management (provisioning/deprovisioning), replacing the older OData connector."
    source: "https://help.sap.com/docs/successfactors-platform/setting-up-sap-successfactors-with-identity-authentication-and-identity-provisioning-services/upgrade-from-odata-ips-connector-to-scim-ips-connector-with-sap-successfactors-hcm-suite"
    checked: "2026-09-22"
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
    notes: "Admins can set up two-factor authentication for their users (with risk-based authentication rules and registered token generators such as SAP Authenticator or Google Authenticator) via the Identity Authentication administration console."
    source: "https://help.sap.com/docs/successfactors-platform/setting-up-sap-successfactors-with-identity-authentication-and-identity-provisioning-services/configure-two-factor-authentication"
    checked: "2026-09-22"
  phishing_resistant_mfa:
    support: "supported"
    tier: "enterprise"
    notes: "Identity Authentication (the IdP layer used for SuccessFactors SSO) lets admins enable or disable FIDO2 biometric/WebAuthn authentication (Face ID, Touch ID, Windows Hello) per application so users can log on with a registered biometric device instead of a password."
    source: "https://help.sap.com/docs/cloud-identity-services/cloud-identity-services/enable-or-disable-fido2-biometric-authentication-for-application"
    checked: "2026-09-22"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    notes: "Change Audit reporting in Admin Center tracks changes to personal data, system configuration, and other business data across the HCM suite, capturing who changed what and when via UI, API, or import; reports are available for download for 48 hours."
    source: "https://help.sap.com/docs/successfactors-platform/creating-change-audit-reports/change-audit"
    checked: "2026-09-22"
  jit_provisioning:
    support: "undocumented"
    notes: "help.sap.com returns only a page title to automated fetches. Needs a browser check."
  domain_verification:
    support: "undocumented"
    notes: "help.sap.com is unreadable to fetches. The only domain pages found elsewhere are DKIM and email notification sending domains, not account claiming. Needs a browser check."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
