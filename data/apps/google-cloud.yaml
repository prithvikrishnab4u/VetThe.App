name: "Google Cloud"
category: "infrastructure"
website: "https://cloud.google.com"
description: "Google Cloud is a public cloud platform. Values here cover signing in to and administering the Google Cloud console and projects, through Cloud Identity accounts or Workforce Identity Federation, with access managed in Cloud IAM."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "free"
    protocols: ["SAML", "OIDC"]
    notes: "Workforce Identity Federation lets employees sign in to Google Cloud with an external IdP such as Okta, Ping, AD FS or Entra ID over SAML 2.0 or OIDC. Google says it is free of charge."
    source: "https://cloud.google.com/workforce-identity-federation"
    checked: "2026-11-20"
  sso_enforcement:
    support: "undocumented"
    notes: "Google Cloud docs pages redirect to docs.cloud.google.com, which could not be fetched for this check."
  scim:
    support: "undocumented"
    notes: "Workforce Identity Federation is described as syncless, with no directory sync. Cloud Identity provisioning docs are on docs.cloud.google.com, which could not be fetched for this check."
  mfa_enforcement:
    support: "supported"
    notes: "Security key enforcement lets Google Cloud admins require security keys for users in their organization. No vendor page reached names the plan."
    source: "https://cloud.google.com/security/products/titan-security-key"
    checked: "2026-11-20"
  phishing_resistant_mfa:
    support: "supported"
    notes: "Titan and other FIDO security keys can be used to sign in to Google and Google Cloud, and admins can require them. No vendor page reached names the plan."
    source: "https://cloud.google.com/security/products/titan-security-key"
    checked: "2026-11-20"
  audit_logs:
    support: "supported"
    tier: "free"
    retention: "400 days for admin activity audit logs"
    notes: "Cloud Audit Logs record who did what, when and where for admin and data access activity. Admin activity is always on and kept for 400 days at no additional cost."
    source: "https://cloud.google.com/logging"
    checked: "2026-11-20"
  jit_provisioning:
    support: "undocumented"
    notes: "Workforce Identity Federation needs no directory sync, but the product page doesn't say whether a user record is created at first sign-in. The docs moved to docs.cloud.google.com, which could not be fetched for this check."
  domain_verification:
    support: "undocumented"
    notes: "Domain verification for Cloud Identity is covered on docs.cloud.google.com, which could not be fetched for this check."
  custom_roles:
    support: "supported"
    tier: "free"
    notes: "Cloud IAM includes unlimited custom roles and permissions at no additional cost per user or identity."
    source: "https://cloud.google.com/products/iam"
    checked: "2026-11-20"
  group_role_mapping:
    support: "undocumented"
    notes: "Workforce Identity Federation maps IdP attributes to Google Cloud attributes to scope access, but the product page doesn't say IdP groups can grant IAM roles. The docs on docs.cloud.google.com could not be fetched for this check."
  session_controls:
    support: "undocumented"
    notes: "Session length and reauthentication settings are documented on docs.cloud.google.com and Google Workspace help, which could not be fetched for this check."
  api_token_controls:
    support: "undocumented"
    notes: "Service account key and API key restrictions are documented on docs.cloud.google.com, which could not be fetched for this check."
