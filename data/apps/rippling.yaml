name: "Rippling"
category: "hr"
website: "https://www.rippling.com"
description: "Workforce management platform that manages HR, IT, and Finance in a single system."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "undocumented"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "add_on"
    plan: "Rippling IT"
    notes: "Authentication policies can require MFA for groups or individual employees."
    source: "https://www.rippling.com/products/it/identity-access-management"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "add_on"
    plan: "Rippling IT"
    notes: "Policies can require YubiKeys, for example for admins."
    source: "https://www.rippling.com/products/it/identity-access-management"
    checked: "2026-09-16"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "The SAML and OIDC guides found describe Rippling acting as an IdP for other apps. Nothing states that accounts are created in Rippling itself on first SSO sign-in."
  domain_verification:
    support: "undocumented"
    notes: "No page on domain verification or account claiming for Rippling."
  custom_roles:
    support: "supported"
    tier: "paid"
    plan: "Rippling Platform"
    notes: "Permission profiles define scope, data access and actions."
    source: "https://www.rippling.com/platform/permissions"
    checked: "2026-09-16"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
