name: "Microsoft Azure"
category: "infrastructure"
website: "https://azure.microsoft.com"
description: "Microsoft Azure is a cloud computing platform managed through the Azure portal, CLI and APIs, with sign-in handled by Microsoft Entra ID."
status: "draft"

capabilities:
  sso:
    support: "supported"
    protocols: ["SAML"]
    notes: "Azure sign-in goes through Microsoft Entra ID, which can federate with a SAML 2.0 identity provider (or AD FS / PingFederate) for sign-on to Entra ID-secured resources. The doc names no plan."
    source: "https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-fed-saml-idp"
    checked: "2026-09-28"
  sso_enforcement:
    support: "undocumented"
    notes: "Azure has no separate login of its own; accounts are Entra ID accounts. The docs checked don't describe blocking password sign-in in favour of federation."
  scim:
    support: "undocumented"
    notes: "Azure users are Entra ID directory objects; the docs checked don't describe SCIM provisioning into Azure itself."
  mfa_enforcement:
    support: "supported"
    notes: "Microsoft enforces mandatory MFA for all accounts signing in to the Azure portal (since 2024) and to Azure CLI, PowerShell, the mobile app and IaC tools for create, update and delete operations (since October 2025)."
    source: "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-mandatory-multifactor-authentication"
    checked: "2026-09-28"
  phishing_resistant_mfa:
    support: "supported"
    notes: "Entra ID supports passkeys (FIDO2), including device-bound passkeys and FIDO2 security keys, for sign-in. The mandatory Azure MFA doc says passkeys satisfy the MFA requirement."
    source: "https://learn.microsoft.com/en-us/entra/identity/authentication/concept-authentication-passkeys-fido2"
    checked: "2026-09-28"
  audit_logs:
    support: "supported"
    tier: "free"
    retention: "90 days"
    notes: "The Azure Monitor activity log records control plane operations. Azure keeps events for 90 days at no charge; export via a diagnostic setting to keep them longer."
    source: "https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log"
    checked: "2026-09-28"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "supported"
    notes: "Entra ID lets you prove ownership of a DNS domain and take over an unmanaged directory created by self-service sign-ups on that domain."
    source: "https://learn.microsoft.com/en-us/entra/identity/users/domains-admin-takeover"
    checked: "2026-09-28"
  custom_roles:
    support: "supported"
    notes: "If the Azure built-in roles don't fit, you can create custom roles and assign them to users, groups and service principals at management group, subscription and resource group scopes."
    source: "https://learn.microsoft.com/en-us/azure/role-based-access-control/custom-roles"
    checked: "2026-09-28"
  group_role_mapping:
    support: "supported"
    notes: "Azure RBAC roles can be assigned to Entra ID groups as well as to users, service principals and managed identities."
    source: "https://learn.microsoft.com/en-us/azure/role-based-access-control/overview"
    checked: "2026-09-28"
  session_controls:
    support: "supported"
    notes: "A Global Administrator can set a directory-wide Azure portal inactivity timeout; users can only pick a shorter one for themselves."
    source: "https://learn.microsoft.com/en-us/azure/azure-portal/set-preferences"
    checked: "2026-09-28"
  api_token_controls:
    support: "undocumented"
