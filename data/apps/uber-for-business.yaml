name: "Uber for Business"
category: "finance"
website: "https://www.uber.com/business"
description: "Global mobility and delivery platform for enterprises."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "partial"
    notes: "SAML 2.0 SSO only for admin roles accessing the dashboard, not the mobile app; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://help.uber.com/business/article/single-sign-on-sso-based-login?nodeId=4092da37-958c-4ab1-a636-74329d8004a2"
    checked: "2026-09-15"
  sso_enforcement:
    support: "unknown"
  scim:
    support: "supported"
    notes: "SCIM 2.0 with pre-built apps for Okta, OneLogin and Azure; other IdPs need account manager approval; plan requirement not stated"
    source: "https://developer.uber.com/docs/scim/introduction"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "unknown"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "unknown"
  jit_provisioning:
    support: "unknown"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
