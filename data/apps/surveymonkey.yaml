name: "SurveyMonkey"
category: "sales_marketing"
website: "https://www.surveymonkey.com"
description: "Online survey tool for capturing the voices and opinions of the people who matter most to you."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SAML 2.0, service provider initiated; Enterprise teams only."
    protocols: ["SAML"]
    source: "https://help.surveymonkey.com/en/surveymonkey/teams/single-sign-on/"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "In beta and requires SSO. Creates accounts, syncs names and email, and deactivates members from the IdP; role and seat assignment stays with admins."
    source: "https://help.surveymonkey.com/en/surveymonkey/teams/scim/"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Team Activity records logins, collaboration, survey, app install and SCIM events with member, date and location."
    retention: "3 years"
    source: "https://help.surveymonkey.com/en/surveymonkey/teams/team-activity/"
    checked: "2026-09-16"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Enterprise admin controls include locking down the organization's email domain."
    source: "https://www.surveymonkey.com/product/enterprise/admin-security-features/"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
