name: "Azure DevOps"
category: "development"
website: "https://azure.microsoft.com/en-us/products/devops"
description: "Services for teams to share code, track work, and ship software."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "free"
    plan: "Any Azure DevOps organization connected to Entra ID (free tier)"
    notes: "Organizations connected to Microsoft Entra ID sign in with Entra work credentials; unconnected orgs use Microsoft accounts; no paid Azure DevOps or Entra license required to connect"
    source: "https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/connect-organization-to-azure-ad"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "free"
    plan: "Any Azure DevOps organization connected to Entra ID (free tier)"
    notes: "Entra-backed orgs only admit members or guests of the connected tenant; disabled or removed Entra users lose access, including via PATs and SSH; no paid license required"
    source: "https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/access-with-azure-ad"
    checked: "2026-09-16"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "add_on"
    plan: "Microsoft Entra ID P1 (Conditional Access)"
    notes: "Enforced by Entra Conditional Access policies targeting the Azure DevOps resource, not an Azure DevOps setting; Conditional Access requires Microsoft Entra ID P1 or higher, a paid add-on to Entra ID"
    source: "https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "add_on"
    plan: "Microsoft Entra ID P1 (Conditional Access)"
    notes: "Entra Conditional Access for Azure DevOps can require a phishing-resistant authentication strength; requires Microsoft Entra ID P1 or higher, a paid add-on to Entra ID"
    source: "https://learn.microsoft.com/en-us/entra/identity/conditional-access/overview"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "free"
    plan: "Any Azure DevOps organization connected to Entra ID (free tier)"
    retention: "90 days"
    notes: "Public preview; Entra-backed orgs only; off by default; CSV/JSON export and audit streaming; sign-in events are not tracked (see Entra logs); the 'Log audit events' policy is an org-level toggle with no paid-plan gate"
    source: "https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/change-application-access-policies"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "free"
    plan: "Free"
    notes: "Members of Entra groups with group rules are added to the organization on first sign-in."
    source: "https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/assign-access-levels-by-group-membership?view=azure-devops"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "supported"
    tier: "free"
    plan: "Any Azure DevOps organization (free tier)"
    notes: "Org policy restricts PAT creation; Entra tenant policies restrict global and full-scoped PATs and enforce maximum PAT lifespan; SSH and OAuth app access can be disabled; these are org/tenant-level policies with no paid-plan gate"
    source: "https://learn.microsoft.com/en-us/azure/devops/organizations/accounts/change-application-access-policies"
    checked: "2026-09-16"
