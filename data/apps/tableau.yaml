name: "Tableau"
category: "productivity"
website: "https://www.tableau.com"
description: "A business intelligence and data visualization platform used for analyzing and sharing data insights."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Tableau Cloud (any site tier, including Standard)"
    protocols: ["SAML", "OIDC"]
    notes: "Tableau Cloud supports SAML, OIDC, Google and Salesforce authentication; SSO/SAML is not listed among the Tableau Enterprise-exclusive features (Data Management, Advanced Management, Pulse, eLearning), so it is available on Standard-tier sites"
    source: "https://help.tableau.com/current/online/en-us/to_tab_enterprise_features.htm"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Tableau Cloud (any site tier, including Standard)"
    notes: "Tableau Cloud SCIM for users and groups; requires SAML, OIDC or Google SSO on the site; not listed among Tableau Enterprise-exclusive features"
    source: "https://help.tableau.com/current/online/en-us/to_tab_enterprise_features.htm"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Tableau Cloud (any site tier, including Standard)"
    notes: "MFA is required for Tableau Cloud access since February 2022 when using Tableau credentials; not listed among Tableau Enterprise-exclusive features"
    source: "https://help.tableau.com/current/online/en-us/to_tab_enterprise_features.htm"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "paid"
    plan: "Tableau Cloud (any site tier, including Standard)"
    notes: "Security keys listed as an MFA verification method; not listed among Tableau Enterprise-exclusive features"
    source: "https://help.tableau.com/current/online/en-us/to_tab_enterprise_features.htm"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "add_on"
    plan: "Tableau Advanced Management"
    notes: "Activity Log delivers site event logs to an Amazon S3 bucket"
    source: "https://help.tableau.com/current/online/en-us/activity_log_setup.htm"
    checked: "2026-09-15"
  jit_provisioning:
    support: "undocumented"
    notes: "SAML docs say users must already be added to the site; SCIM is the documented automatic provisioning path."
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
