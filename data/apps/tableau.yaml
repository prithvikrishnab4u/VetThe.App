name: "Tableau"
category: "productivity"
website: "https://www.tableau.com"
description: "A business intelligence and data visualization platform used for analyzing and sharing data insights."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "Tableau Cloud supports SAML, OIDC, Google and Salesforce authentication; plan requirement not stated"
    protocols: ["SAML", "OIDC"]
    source: "https://help.tableau.com/current/online/en-us/security_auth.htm"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    notes: "Tableau Cloud SCIM for users and groups; requires SAML, OIDC or Google SSO on the site; plan requirement not stated"
    source: "https://help.tableau.com/current/online/en-us/scim_config_online.htm"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    notes: "MFA is required for Tableau Cloud access since February 2022 when using Tableau credentials; plan requirement not stated"
    source: "https://help.tableau.com/current/online/en-us/security_auth.htm"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "supported"
    notes: "Security keys listed as a Tableau with MFA verification method; plan requirement not stated"
    source: "https://help.tableau.com/current/online/en-us/security_auth.htm"
    checked: "2026-09-15"
  audit_logs:
    support: "supported"
    tier: "add_on"
    plan: "Tableau Advanced Management"
    notes: "Activity Log delivers site event logs to an Amazon S3 bucket"
    source: "https://help.tableau.com/current/online/en-us/activity_log_setup.htm"
    checked: "2026-09-15"
  jit_provisioning:
    support: "undocumented"
    notes: "SAML docs say users must already be added to the site; SCIM is the documented automatic provisioning path."
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
