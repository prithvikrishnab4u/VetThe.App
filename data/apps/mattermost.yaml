name: "Mattermost Cloud"
category: "collaboration"
website: "https://mattermost.com"
description: "Mattermost is a team messaging and workflow platform offered as a managed cloud service or self-hosted."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    protocols: ["SAML", "OIDC"]
    notes: "SAML 2.0 and OpenID Connect are on Professional, Enterprise, and Enterprise Advanced (also the free self-hosted Entry edition, but not Team Edition)."
    source: "https://docs.mattermost.com/administration-guide/onboard/sso-saml.html"
    checked: "2026-09-27"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "Setting \"Enable sign-in with email\" to false removes email and password login so people can only sign in through single sign-on."
    source: "https://docs.mattermost.com/administration-guide/configure/authentication-configuration-settings.html"
    checked: "2026-09-27"
  scim:
    support: "not_supported"
    notes: "The SAML FAQ says SCIM isn't supported. Provisioning and deprovisioning rely on AD/LDAP sync instead."
    source: "https://docs.mattermost.com/administration-guide/onboard/sso-saml-faq.html"
    checked: "2026-09-27"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "\"Enforce Multi-factor Authentication\" makes email and LDAP users set up MFA before they can use the site. SSO users rely on their IdP."
    source: "https://docs.mattermost.com/administration-guide/onboard/multi-factor-authentication.html"
    checked: "2026-09-27"
  phishing_resistant_mfa:
    support: "undocumented"
    notes: "The MFA docs only describe TOTP authenticator apps; no passkey or security key option is mentioned."
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise or Enterprise Advanced"
    notes: "Audit logging is in Beta. Cloud admins configure it under System Console > Compliance > Audit Logging, but can't use local file output."
    source: "https://docs.mattermost.com/administration-guide/manage/logging.html"
    checked: "2026-09-27"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "Accounts are created automatically the first time a user signs in with SAML. SAML alone doesn't update attributes periodically or deprovision users."
    source: "https://docs.mattermost.com/administration-guide/onboard/sso-saml.html"
    checked: "2026-09-27"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise or Enterprise Advanced"
    notes: "Delegated granular administration lets you adjust the permissions of fixed admin roles (System Manager, User Manager, Viewer, and others). The docs don't describe creating new named roles."
    source: "https://docs.mattermost.com/administration-guide/onboard/delegated-granular-administration.html"
    checked: "2026-09-27"
  group_role_mapping:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise or Enterprise Advanced"
    notes: "Only through AD/LDAP group sync, which can give group members the Team admin or Channel admin role. Not on Professional."
    source: "https://docs.mattermost.com/administration-guide/onboard/ad-ldap-groups-synchronization.html"
    checked: "2026-09-27"
  session_controls:
    support: "supported"
    notes: "Admins set session lengths for email/LDAP, mobile, and SSO logins, whether sessions extend with activity, and whether a password change ends sessions."
    source: "https://docs.mattermost.com/administration-guide/configure/environment-configuration-settings.html"
    checked: "2026-09-27"
  api_token_controls:
    support: "supported"
    notes: "Personal access tokens are off by default. Admins turn them on and choose which users can create them."
    source: "https://docs.mattermost.com/administration-guide/configure/integrations-configuration-settings.html"
    checked: "2026-09-27"
