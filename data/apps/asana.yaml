name: "Asana"
category: "productivity"
website: "https://asana.com"
description: "A work management platform that helps teams orchestrate their work."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "\"SAML authentication\" listed on Enterprise per pricing page; Google SSO is available from Starter"
    protocols: ["SAML"]
    source: "https://asana.com/pricing"
    checked: "2026-09-16"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "\"User provisioning (SCIM)\" listed on Enterprise per pricing page"
    source: "https://asana.com/pricing"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Starter"
    notes: "\"Enforce two-factor authentication for domain members and guests\" listed from Starter upward per pricing page"
    source: "https://asana.com/pricing"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise+, or Enterprise with the Compliance Management add-on"
    notes: "Audit log API for service accounts; in-app view and retention not stated on this page"
    source: "https://developers.asana.com/docs/audit-log-api"
    checked: "2026-09-14"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    notes: "\"Session duration limits\" listed among admin console controls; plan requirement not stated"
    source: "https://asana.com/features/admin-security"
    checked: "2026-09-16"
  api_token_controls:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise+"
    notes: "Personal access tokens are persistent by default; Enterprise+ adds admin controls over how PATs are handled via the Manage apps panel"
    source: "https://developers.asana.com/docs/personal-access-token"
    checked: "2026-09-16"
