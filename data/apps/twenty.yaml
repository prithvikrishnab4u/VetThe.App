name: "Twenty"
category: "sales_marketing"
website: "https://twenty.com"
description: "Twenty is an open-source CRM available as a cloud service or self-hosted."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Organization"
    protocols: ["SAML"]
    notes: "SSO works with SAML 2.0, Google Workspace and Microsoft Entra ID. It is a Premium feature on the Organization plan (cloud and self-hosted)."
    source: "https://docs.twenty.com/user-guide/permissions-access/capabilities/sso-configuration"
    checked: "2026-09-28"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Organization"
    notes: "Once SSO is configured, you can disable password login for SSO users to enforce sign-in through your identity provider. SSO is Organization plan only."
    source: "https://docs.twenty.com/user-guide/permissions-access/how-tos/permissions-faq"
    checked: "2026-09-28"
  scim:
    support: "undocumented"
    notes: "The SSO docs cover JIT and manual invites but don't mention SCIM."
  mfa_enforcement:
    support: "undocumented"
    notes: "Users can turn on authenticator-app 2FA for their own account; the docs don't describe a way for admins to require it."
  phishing_resistant_mfa:
    support: "undocumented"
    notes: "The only 2FA method documented is an authenticator app."
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Organization"
    notes: "Audit logs, to check what each workspace member has been doing, are a Premium feature on the Organization plans."
    source: "https://docs.twenty.com/user-guide/billing/capabilities/pricing-plans"
    checked: "2026-09-28"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "Organization"
    notes: "With JIT provisioning, accounts are created on first SSO login and get the default role. SSO is Organization plan only."
    source: "https://docs.twenty.com/user-guide/permissions-access/how-tos/permissions-faq"
    checked: "2026-09-28"
  domain_verification:
    support: "undocumented"
    notes: "Approved access domains let anyone at that email domain join without an invite, but the docs don't describe verifying the domain or taking over existing accounts."
  custom_roles:
    support: "supported"
    notes: "Admins can create roles and set object, field, settings and action permissions. Row-level permissions need the Organization plan."
    source: "https://docs.twenty.com/user-guide/permissions-access/capabilities/permissions"
    checked: "2026-09-28"
  group_role_mapping:
    support: "undocumented"
    notes: "The SSO page only says to map IdP groups to roles \"if available\"; no setup is documented."
  session_controls:
    support: "undocumented"
  api_token_controls:
    support: "supported"
    notes: "Workspace API keys can be assigned a role that limits what they can access; keys with no role use default permissions. The docs don't cover reviewing or revoking keys by user."
    source: "https://docs.twenty.com/user-guide/permissions-access/capabilities/permissions"
    checked: "2026-09-28"
