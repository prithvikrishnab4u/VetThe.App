name: "Workday"
category: "hr"
website: "https://www.workday.com"
description: "Enterprise management cloud platform for finance, HR, planning, and spend management."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML IdP- and SP-initiated; Google is the only supported OpenID Connect provider; plan requirement not stated"
    protocols: ["SAML", "OIDC"]
    source: "https://doc.workday.com/admin-guide/en-us/manage-workday/tenant-configuration/tenant-setup/dan1370796470031.html"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    notes: "Maximum Grace Signin Count forces MFA enrollment; authenticator app, backup codes, Duo, email or SMS OTP; plan requirement not stated"
    source: "https://doc.workday.com/admin-guide/en-us/manage-workday/tenant-configuration/tenant-setup/dan1370796470031.html"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Audit trail, user activity logs and sign-on reports; plan requirement not stated"
    source: "https://www.workday.com/en-ca/why-workday/trust/security.html"
    checked: "2026-09-15"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
