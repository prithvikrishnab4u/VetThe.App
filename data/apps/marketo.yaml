name: "Marketo"
category: "sales_marketing"
website: "https://www.marketo.com"
description: "Marketing automation software that helps marketers master the art and science of digital marketing."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    protocols: ["SAML"]
    notes: "SAML 2.0, IdP-initiated only; subscriptions on Adobe Identity configure SSO in Adobe Admin Console. Marketo Engage has no published self-serve pricing — all editions (Growth/Select/Prime/Ultimate) are quote-based via Adobe Sales."
    source: "https://business.adobe.com/products/marketo/pricing.html"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Require SSO setting per user, with Bypass Single Sign-On role option; not for Adobe IMS subscriptions. Marketo Engage has no published self-serve pricing — all editions are quote-based via Adobe Sales."
    source: "https://business.adobe.com/products/marketo/pricing.html"
    checked: "2026-09-16"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "All customers"
    notes: "Audit Trail of asset, program, admin and login events"
    retention: "30 days in UI, six months via export"
    source: "https://experienceleague.adobe.com/en/docs/marketo/using/product-docs/administration/audit-trail/audit-trail-overview"
    checked: "2026-09-15"
  jit_provisioning:
    support: "not_supported"
    notes: "Users are provisioned manually; first SAML login does not create users"
    source: "https://experienceleague.adobe.com/en/docs/marketo/using/product-docs/administration/additional-integrations/add-single-sign-on-to-a-portal"
    checked: "2026-09-15"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Admins create roles by selecting individual permissions. Marketo Engage has no published self-serve pricing — all editions are quote-based via Adobe Sales."
    source: "https://business.adobe.com/products/marketo/pricing.html"
    checked: "2026-09-16"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
