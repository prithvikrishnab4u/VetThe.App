name: "Marketo"
category: "sales_marketing"
website: "https://www.marketo.com"
description: "Marketing automation software that helps marketers master the art and science of digital marketing."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML 2.0, IdP-initiated only; subscriptions on Adobe Identity configure SSO in Adobe Admin Console; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://experienceleague.adobe.com/en/docs/marketo/using/product-docs/administration/additional-integrations/add-single-sign-on-to-a-portal"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "Require SSO setting per user, with Bypass Single Sign-On role option; not for Adobe IMS subscriptions; plan requirement not stated"
    source: "https://experienceleague.adobe.com/en/docs/marketo/using/product-docs/administration/additional-integrations/restrict-user-login-to-sso-only"
    checked: "2026-09-15"
  scim:
    support: "unknown"
  mfa_enforcement:
    support: "unknown"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "All customers"
    notes: "Audit Trail of asset, program, admin and login events"
    retention: "30 days in UI, six months via export"
    source: "https://experienceleague.adobe.com/en/docs/marketo/using/product-docs/administration/audit-trail/audit-trail-overview"
    checked: "2026-09-15"
  jit_provisioning:
    support: "not_supported"
    notes: "Users are provisioned manually; first SAML login does not create users"
    source: "https://experienceleague.adobe.com/en/docs/marketo/using/product-docs/administration/additional-integrations/add-single-sign-on-to-a-portal"
    checked: "2026-09-15"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "supported"
    notes: "Admins create roles by selecting individual permissions; plan requirement not stated"
    source: "https://experienceleague.adobe.com/en/docs/marketo/using/product-docs/administration/users-and-roles/descriptions-of-role-permissions"
    checked: "2026-09-15"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
