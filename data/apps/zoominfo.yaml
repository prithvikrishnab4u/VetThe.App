name: "ZoomInfo"
category: "sales_marketing"
website: "https://www.zoominfo.com"
description: "GTM software, data, and intelligence for more than 35,000 companies worldwide."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    protocols: ["SAML"]
    notes: "SAML 2.0 configured in Admin Portal > User Management > Single Sign-On; IdP- and SP-initiated."
    source: "https://tech-docs-library.zoominfo.com/zoominfo-sso-idp-config-examples.pdf"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    notes: "Require SSO toggle limits sign-in to the SSO identity provider."
    source: "https://tech-docs-library.zoominfo.com/zoominfo-sso-idp-config-examples.pdf"
    checked: "2026-09-16"
  scim:
    support: "supported"
    notes: "SCIM 2.0 create, update and deactivate users; requires SSO to be configured first."
    source: "https://tech-docs-library.zoominfo.com/zoominfo-sso-scim-provisioning-implementation-guide.pdf"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "help.zoominfo.com returns a loading error to automated fetches. Needs a browser check."
  domain_verification:
    support: "undocumented"
    notes: "Same blocked host. Needs a browser check."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "supported"
    notes: "Okta SCIM app maps role and products per assigned IdP group."
    source: "https://tech-docs-library.zoominfo.com/zoominfo-sso-scim-provisioning-implementation-guide.pdf"
    checked: "2026-09-16"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
