name: "Front"
category: "collaboration"
website: "https://front.com"
description: "Customer operations platform that combines a help desk with the collaboration of email."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "Any SAML-based IdP; SAML is the only option; latest Professional plan or above"
    protocols: ["SAML"]
    source: "https://help.front.com/en/articles/2280"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Professional"
    notes: "SCIM 2.0 API; Entra ID, Okta, Google Workspace, OneLogin, Rippling, Gusto; supports teammate group sync"
    source: "https://help.front.com/en/articles/2207"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "All plans"
    notes: "Admins can see who changed settings and resources, what changed and when"
    retention: "365 days"
    source: "https://help.front.com/en/articles/2925696"
    checked: "2026-09-15"
  jit_provisioning:
    support: "undocumented"
    notes: "Front's SSO and user provisioning docs cover SAML login and SCIM via IdPs but don't say whether accounts are created on first SSO sign-in."
  domain_verification:
    support: "undocumented"
    notes: "Front only documents SPF/DKIM setup for email deliverability, not domain ownership verification that controls accounts."
  custom_roles:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Pricing page lists custom roles on Enterprise"
    source: "https://front.com/pricing"
    checked: "2026-09-15"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
