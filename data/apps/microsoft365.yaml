name: "Microsoft 365"
category: "productivity"
website: "https://microsoft365.com"
description: "Suite of productivity apps, cloud services, and security for businesses."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "free"
    protocols: ["SAML", "OIDC"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "supported"
    tier: "free"
  mfa_enforcement:
    support: "supported"
    tier: "free"
  phishing_resistant_mfa:
    support: "supported"
  audit_logs:
    support: "supported"
    tier: "free"
    retention: "90 days"
  jit_provisioning:
    support: "unknown"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "supported"
  api_token_controls:
    support: "unknown"
