name: "Microsoft 365"
category: "productivity"
website: "https://microsoft365.com"
description: "Suite of productivity apps, cloud services, and security for businesses."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Any Microsoft 365 subscription (Entra ID tenant-level federation, not gated by Entra ID P1/P2)"
    protocols: ["SAML"]
    notes: "Microsoft 365 sign-in is handled by Microsoft Entra ID; custom domains can be federated to a third-party SAML 2.0 SP-Lite IdP, with a limited set of supported clients"
    source: "https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-fed-saml-idp"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Any Microsoft 365 subscription (Entra ID tenant-level federation, not gated by Entra ID P1/P2)"
    notes: "Entra ID control: converting a custom domain to federated sends that domain's sign-ins to the external IdP; the default onmicrosoft.com domain can't be federated"
    source: "https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-fed-saml-idp"
    checked: "2026-09-16"
  scim:
    support: "partial"
    tier: "paid"
    plan: "Microsoft Entra ID P1"
    notes: "Entra ID control, not M365: API-driven inbound provisioning accepts SCIM-schema bulk payloads via Graph /bulkUpload; not a standard SCIM endpoint for an external IdP"
    source: "https://learn.microsoft.com/en-us/entra/identity/app-provisioning/inbound-provisioning-api-concepts"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    plan: "Microsoft Entra ID Free (security defaults)"
    notes: "Entra ID control: security defaults require MFA registration for all users at no extra cost; customizable Conditional Access MFA policies need Entra ID P1"
    source: "https://learn.microsoft.com/en-us/entra/fundamentals/security-defaults"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "Microsoft Entra ID Free"
    notes: "Entra ID control: passkeys (FIDO2) in all Entra editions; requiring them via Conditional Access authentication strength needs Entra ID P1"
    source: "https://learn.microsoft.com/en-us/entra/identity/authentication/how-to-enable-passkey-fido2"
    checked: "2026-09-15"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "Audit (Standard), included with any Microsoft 365 subscription that has the audit log enabled by default"
    retention: "180 days (Audit Standard)"
    notes: "Microsoft Purview unified audit log; Audit (Standard) is enabled by default for organizations with the appropriate subscription and gives 180-day retention; Audit (Premium), which adds retention policies up to 1 year (10 years with an add-on license), requires E5/G5/A5 or an add-on"
    source: "https://learn.microsoft.com/en-us/purview/audit-solutions-overview"
    checked: "2026-09-16"
  jit_provisioning:
    support: "not_supported"
    notes: "Users must already exist in Microsoft Entra ID before federated sign-in."
    source: "https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/how-to-connect-fed-saml-idp"
    checked: "2026-09-16"
  domain_verification:
    support: "supported"
    tier: "paid"
    plan: "Business Basic"
    notes: "Custom domains are verified with a DNS TXT/MX record or a file on the website."
    source: "https://learn.microsoft.com/en-us/microsoft-365/admin/setup/add-domain"
    checked: "2026-09-16"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
