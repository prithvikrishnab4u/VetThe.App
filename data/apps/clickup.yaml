name: "ClickUp"
category: "productivity"
website: "https://clickup.com"
description: "The all-in-one productivity platform where teams can come together to plan, organize, and collaborate."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Custom SAML is Enterprise only; Google and Microsoft SSO are listed from the Unlimited plan"
    protocols: ["SAML"]
    source: "https://help.clickup.com/hc/en-us/articles/6305027039767-Configure-custom-SAML-single-sign-on"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SAML login policy: required for all users, all except guests, all except limited members and guests, or optional"
    source: "https://help.clickup.com/hc/en-us/articles/6305027039767-Configure-custom-SAML-single-sign-on"
    checked: "2026-09-15"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SCIM base URL and token issued after Custom SAML is configured; Okta full automatic provisioning"
    source: "https://help.clickup.com/hc/en-us/articles/6305027039767-Configure-custom-SAML-single-sign-on"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Business"
    notes: "Owners/admins can require 2FA for the Workspace on Business and above; SMS or authenticator app"
    source: "https://help.clickup.com/hc/en-us/articles/6327741965591-Activate-and-manage-two-factor-authentication"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Pricing lists Audit Log on Enterprise; Workspace audit logs cover user auth events, tasks, fields, hierarchy; API export"
    source: "https://clickup.com/pricing"
    checked: "2026-09-15"
  jit_provisioning:
    support: "partial"
    tier: "paid"
    plan: "Business"
    notes: "With Google SSO, new people can sign up through the SSO link and be added to the Workspace automatically; custom SAML requires invited users to link accounts."
    source: "https://help.clickup.com/hc/en-us/articles/6305105918615-Google-single-sign-on"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
    notes: "No domain ownership verification found in ClickUp help center."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
