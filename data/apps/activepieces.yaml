name: "Activepieces"
category: "productivity"
website: "https://www.activepieces.com"
description: "Activepieces is an open-source workflow automation platform for connecting apps and building automated flows."
status: "draft"

capabilities:
  sso:
    support: "supported"
    protocols: ["SAML"]
    notes: "Platform admins can set up SSO with Google, GitHub, Okta, Microsoft Entra ID or JumpCloud (SAML 2.0) under Platform Settings. The docs call it a paid feature without naming a plan."
    source: "https://www.activepieces.com/docs/admin-guide/guides/sso"
    checked: "2026-09-28"
  sso_enforcement:
    support: "supported"
    notes: "Admins can enforce SSO for users with matching email domains and turn off email and password login. The docs call it a paid feature without naming a plan."
    source: "https://www.activepieces.com/docs/admin-guide/guides/sso"
    checked: "2026-09-28"
  scim:
    support: "supported"
    notes: "SCIM creates, updates and deactivates users from Okta or Microsoft Entra ID. The docs call it a paid feature without naming a plan."
    source: "https://www.activepieces.com/docs/admin-guide/guides/scim/overview"
    checked: "2026-09-28"
  mfa_enforcement:
    support: "undocumented"
    notes: "The docs don't describe requiring MFA for platform users."
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Platform admins can view audit logs under Security, filter them by action, user, project and date, and stream them to a webhook or SIEM. Retention isn't stated. The docs call it a paid feature without naming a plan."
    source: "https://www.activepieces.com/docs/admin-guide/security/audit-logs/overview"
    checked: "2026-09-28"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "undocumented"
    notes: "The SSO docs use an email domain to route users to SSO but don't describe verifying domain ownership."
  custom_roles:
    support: "supported"
    notes: "Platform admins can create custom project roles under Security > Project Roles. The docs call it a paid feature without naming a plan."
    source: "https://www.activepieces.com/docs/admin-guide/guides/permissions"
    checked: "2026-09-28"
  group_role_mapping:
    support: "partial"
    notes: "SCIM groups from Okta become projects and their members are added, but members get the default Editor project role; the platform role can be set with an Okta attribute."
    source: "https://www.activepieces.com/docs/admin-guide/guides/scim/providers/okta"
    checked: "2026-09-28"
  session_controls:
    support: "undocumented"
  api_token_controls:
    support: "undocumented"
