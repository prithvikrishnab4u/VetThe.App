name: "Xero"
category: "finance"
website: "https://www.xero.com"
description: "Cloud-based accounting software for small businesses to manage finances, invoicing, and inventory."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    protocols: ["SAML"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "unknown"
  mfa_enforcement:
    support: "supported"
    tier: "free"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "unknown"
  jit_provisioning:
    support: "not_supported"
  domain_verification:
    support: "not_supported"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
