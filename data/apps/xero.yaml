name: "Xero"
category: "finance"
website: "https://www.xero.com"
description: "Cloud-based accounting software for small businesses to manage finances, invoicing, and inventory."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "undocumented"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Early"
    notes: "MFA mandatory for all users invited to an organisation; Xero has no perpetual free tier (only a trial), so the cheapest paid plan (Early) is where this applies, same as every other tier."
    source: "https://www.xero.com/us/pricing-plans/"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "No vendor page documents external SAML or SSO at all. The security page covers MFA only, so it is not even clear SSO exists."
  domain_verification:
    support: "undocumented"
    notes: "No vendor page on email domain verification or account capture."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
