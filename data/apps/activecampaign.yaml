name: "ActiveCampaign"
category: "sales_marketing"
website: "https://www.activecampaign.com"
description: "Automation-first marketing and CRM platform helping businesses connect with customers."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Starter, Plus, Pro, Enterprise"
    notes: "Works with any SAML provider"
    protocols: ["SAML"]
    source: "https://help.activecampaign.com/hc/en-us/articles/4404715700892-Set-up-single-sign-on-SSO-for-your-ActiveCampaign-account"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Starter, Plus, Pro, Enterprise"
    notes: "Enforce Single Sign-on removes email and password login"
    source: "https://help.activecampaign.com/hc/en-us/articles/4404715700892-Set-up-single-sign-on-SSO-for-your-ActiveCampaign-account"
    checked: "2026-09-15"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Starter, Plus, Pro, Enterprise"
    notes: "Admins can enforce account-wide MFA via authenticator app or SMS"
    source: "https://help.activecampaign.com/hc/en-us/articles/360008574740-Set-up-multi-factor-authentication-for-your-ActiveCampaign-account"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Starter, Plus, Pro, Enterprise"
    notes: "Unknown emails are created on first SSO login in an SSO Users group"
    source: "https://help.activecampaign.com/hc/en-us/articles/4404715700892-Set-up-single-sign-on-SSO-for-your-ActiveCampaign-account"
    checked: "2026-09-15"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
