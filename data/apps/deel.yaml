name: "Deel"
category: "hr"
website: "https://www.deel.com"
description: "Global payroll and compliance platform for international teams."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML 2.0 and OpenID Connect via the App Store; Okta, Azure, OneLogin, Google, PingFederate; plan requirement not stated"
    protocols: ["SAML", "OIDC"]
    source: "https://help.letsdeel.com/hc/en-gb/articles/20955980375313-How-to-Configure-Single-Sign-On"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "Enforce per worker type; organization admins can still use password login; plan requirement not stated"
    source: "https://help.letsdeel.com/hc/en-gb/articles/20955980375313-How-to-Configure-Single-Sign-On"
    checked: "2026-09-15"
  scim:
    support: "supported"
    notes: "SCIM API for users only, no groups; plan requirement not stated"
    source: "https://developer.deel.com/api/scim-api/overview"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    notes: "Admins set mandatory 2FA separately for Admins and Workers; Deel app push, authenticator app or email OTP; plan requirement not stated"
    source: "https://help.letsdeel.com/hc/en-gb/articles/20543682195729-Two-Factor-Authentication-2FA-for-a-Deel-Account"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
