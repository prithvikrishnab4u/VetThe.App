name: "n8n Cloud"
category: "productivity"
website: "https://n8n.io"
description: "n8n Cloud is the hosted version of the n8n workflow automation tool."
status: "draft"

capabilities:
  sso:
    support: "supported"
    protocols: ["SAML", "OIDC"]
    notes: "SAML and OIDC are both documented, and an instance owner or admin sets them up. The plan note on the SAML page comes from a shared snippet we couldn't read, so no plan is recorded here yet."
    source: "https://docs.n8n.io/administer/manage-users-and-access/verify-user-identity/use-saml/set-up-saml"
    checked: "2026-09-27"
  sso_enforcement:
    support: "supported"
    notes: "With SAML on, users sign in through SAML unless an admin exempts them with Allow Manual Login."
    source: "https://docs.n8n.io/administer/manage-users-and-access/verify-user-identity/use-saml/manage-users-with-saml"
    checked: "2026-09-27"
  scim:
    support: "undocumented"
    notes: "No SCIM page was found. The SAML docs say users removed in the IdP stay in n8n until deleted by hand."
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Admins can require 2FA for all users under Settings > Security (Cloud Enterprise only). It covers email and password logins, not SSO users."
    source: "https://docs.n8n.io/deploy/host-n8n/configure-n8n/security/manage-security-policies"
    checked: "2026-09-27"
  phishing_resistant_mfa:
    support: "undocumented"
    notes: "The 2FA docs only mention authenticator apps."
  audit_logs:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Audit events like logins, user changes, credential changes and API key creation are available through log streaming to external destinations, which n8n Cloud offers on Enterprise. No in-app audit log or retention period is documented."
    source: "https://docs.n8n.io/administer/observe-and-log/stream-logs-to-external-systems"
    checked: "2026-09-27"
  jit_provisioning:
    support: "undocumented"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Custom roles are available on n8n Cloud Enterprise."
    source: "https://docs.n8n.io/administer/manage-users-and-access/set-permissions-and-roles-rbac/create-custom-roles"
    checked: "2026-09-27"
  group_role_mapping:
    support: "supported"
    notes: "Instance and project roles can come from IdP attributes or from rules in n8n that check the user's groups. They're re-checked at every login."
    source: "https://docs.n8n.io/administer/manage-users-and-access/verify-user-identity/use-saml/set-up-saml"
    checked: "2026-09-27"
  session_controls:
    support: "undocumented"
  api_token_controls:
    support: "partial"
    notes: "Each API key gets a label and an expiration time, and scopes are available on Enterprise. No admin-wide key policy is documented, and the API isn't available during the free trial."
    source: "https://docs.n8n.io/connect/n8n-api/authentication"
    checked: "2026-09-27"
