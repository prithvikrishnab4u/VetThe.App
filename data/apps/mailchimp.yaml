name: "Mailchimp"
category: "sales_marketing"
website: "https://mailchimp.com"
description: "Marketing, automation, and email marketing platform for growing businesses."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "undocumented"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    notes: "When an Owner or Admin enables 2-factor authentication for their login, all other users on the account must set it up at their next login. Plan requirement not stated."
    source: "https://mailchimp.com/help/set-up-a-two-factor-authentication-app-at-login/"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "supported"
    notes: "Admins can see API keys other users generated and revoke keys; revoking a user's account access removes the keys they created. Plan requirement not stated."
    source: "https://mailchimp.com/help/about-api-keys/"
    checked: "2026-09-16"
