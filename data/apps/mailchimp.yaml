name: "Mailchimp"
category: "sales_marketing"
website: "https://mailchimp.com"
description: "Marketing, automation, and email marketing platform for growing businesses."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "undocumented"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Essentials"
    notes: "When an Owner or Admin enables 2-factor authentication for their login, all other users on the account must set it up at their next login. The Free plan is limited to 1 seat (Owner only), so this requires at least Essentials, the cheapest plan with additional user seats."
    source: "https://mailchimp.com/help/about-mailchimp-pricing-plans/"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "No Mailchimp page describes SAML or SSO at all, so JIT cannot be confirmed either way. The SSO mentions found are all third-party connector sites."
  domain_verification:
    support: "undocumented"
    notes: "Mailchimp's domain verification is email sending authentication, DKIM and DMARC records. No page addresses claiming accounts on a company domain, either to confirm or rule it out."
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "supported"
    tier: "paid"
    plan: "Essentials"
    notes: "Admins can see API keys other users generated and revoke keys; revoking a user's account access removes the keys they created. Requires the Admin permission level, which is unavailable on the 1-seat Free plan, so this requires at least Essentials."
    source: "https://mailchimp.com/help/about-mailchimp-pricing-plans/"
    checked: "2026-09-16"
