name: "Expensify"
category: "finance"
website: "https://www.expensify.com"
description: "Expense management software for receipt scanning and reimbursement."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Control"
    protocols: ["SAML"]
    notes: "SAML SSO configured by Domain Admins on a verified domain; Control plan is Expensify's enterprise-security tier with SAML/SSO (starts at $9/member/month)"
    source: "https://help.expensify.com/articles/new-expensify/billing-and-subscriptions/explore-plans-subscriptions-and-pricing/Compare-Collect-and-Control-Plans"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Control"
    notes: "Required for login setting forces members to sign in via SSO only; SAML/SSO is part of the Control plan"
    source: "https://help.expensify.com/articles/new-expensify/billing-and-subscriptions/explore-plans-subscriptions-and-pricing/Compare-Collect-and-Control-Plans"
    checked: "2026-09-16"
  scim:
    support: "partial"
    notes: "SCIM only for Okta, requested via concierge@expensify.com after SAML setup; plan requirement not stated"
    source: "https://help.expensify.com/articles/expensify-classic/domains/Set-Up-SAML-SSO"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    notes: "Domain Admins can require 2FA for all domain members; not available on SAML domains; plan requirement not stated"
    source: "https://help.expensify.com/articles/expensify-classic/settings/Enable-two-factor-authentication"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "SAML SSO docs require a verified domain but don't say whether accounts are created on first SSO sign-in."
  domain_verification:
    support: "supported"
    notes: "Domain must be claimed and verified before SAML can be configured; plan requirement not stated"
    source: "https://help.expensify.com/articles/expensify-classic/domains/Set-Up-SAML-SSO"
    checked: "2026-09-15"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
