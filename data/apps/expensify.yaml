name: "Expensify"
category: "finance"
website: "https://www.expensify.com"
description: "Expense management software for receipt scanning and reimbursement."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML SSO configured by Domain Admins on a verified domain; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://help.expensify.com/articles/expensify-classic/domains/Set-Up-SAML-SSO"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "Required for login setting forces members to sign in via SSO only; plan requirement not stated"
    source: "https://help.expensify.com/articles/expensify-classic/domains/Set-Up-SAML-SSO"
    checked: "2026-09-15"
  scim:
    support: "partial"
    notes: "SCIM only for Okta, requested via concierge@expensify.com after SAML setup; plan requirement not stated"
    source: "https://help.expensify.com/articles/expensify-classic/domains/Set-Up-SAML-SSO"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    notes: "Domain Admins can require 2FA for all domain members; not available on SAML domains; plan requirement not stated"
    source: "https://help.expensify.com/articles/expensify-classic/settings/Enable-two-factor-authentication"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "undocumented"
    notes: "SAML SSO docs require a verified domain but don't say whether accounts are created on first SSO sign-in."
  domain_verification:
    support: "supported"
    notes: "Domain must be claimed and verified before SAML can be configured; plan requirement not stated"
    source: "https://help.expensify.com/articles/expensify-classic/domains/Set-Up-SAML-SSO"
    checked: "2026-09-15"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
