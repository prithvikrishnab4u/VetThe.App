name: "Liveblocks"
category: "development"
website: "https://liveblocks.io"
description: "Liveblocks provides APIs and components for adding realtime collaboration features to apps."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "add_on"
    plan: "Pro and Enterprise (paid add-on)"
    protocols: ["SAML", "OIDC"]
    notes: "SAML SSO is a paid add-on on Pro and Enterprise, enabled through sales. The provider list includes some OpenID Connect options; other OIDC providers need a request to support."
    source: "https://liveblocks.io/docs/platform/account-management/saml"
    checked: "2026-09-27"
  sso_enforcement:
    support: "supported"
    tier: "add_on"
    plan: "Pro and Enterprise (paid add-on)"
    notes: "SSO can be enforced for a team, but you have to ask support to turn it on."
    source: "https://liveblocks.io/docs/platform/account-management/saml"
    checked: "2026-09-27"
  scim:
    support: "supported"
    tier: "add_on"
    plan: "Enterprise (add-on)"
    notes: "Directory sync is an Enterprise add-on and needs SSO set up first."
    source: "https://liveblocks.io/docs/platform/account-management/directory-sync"
    checked: "2026-09-27"
  mfa_enforcement:
    support: "supported"
    tier: "add_on"
    plan: "Enterprise (add-on)"
    notes: "Team owners can require authenticator-app MFA for all members. It doesn't apply to SSO members."
    source: "https://liveblocks.io/docs/platform/account-management/mfa"
    checked: "2026-09-27"
  phishing_resistant_mfa:
    support: "undocumented"
    notes: "The MFA docs only cover authenticator app codes; passkeys and security keys aren't mentioned."
  audit_logs:
    support: "undocumented"
    notes: "Plans list an event log retention limit, but no admin audit log for the dashboard is described."
  jit_provisioning:
    support: "supported"
    tier: "add_on"
    plan: "Pro and Enterprise (paid add-on)"
    notes: "By default SSO users still need an invite; auto-adding SSO sign-ups to the team is available on request."
    source: "https://liveblocks.io/docs/platform/account-management/saml"
    checked: "2026-09-27"
  domain_verification:
    support: "supported"
    tier: "add_on"
    plan: "Pro and Enterprise (paid add-on)"
    notes: "Once SSO is enabled, owners can verify domains themselves from the dashboard."
    source: "https://liveblocks.io/docs/platform/account-management/saml"
    checked: "2026-09-27"
  custom_roles:
    support: "undocumented"
    notes: "The team members docs describe two fixed roles, Owner and Member."
  group_role_mapping:
    support: "supported"
    tier: "add_on"
    plan: "Enterprise (add-on)"
    notes: "Directory sync maps identity provider groups to Liveblocks team roles."
    source: "https://liveblocks.io/docs/platform/account-management/directory-sync"
    checked: "2026-09-27"
  session_controls:
    support: "undocumented"
  api_token_controls:
    support: "undocumented"
    notes: "Both Owners and Members can manage API keys for all projects; no finer controls are described."
