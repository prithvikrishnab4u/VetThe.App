name: "Jira Service Management"
category: "infrastructure"
website: "https://atlassian.com/software/jira/service-management"
description: "Jira Service Management is Atlassian's IT service management and help desk app. Values here cover how agents and admins sign in with Atlassian accounts and how org admins manage them in Atlassian Administration. SSO, SCIM and some controls need Atlassian Guard, a separate subscription."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "add_on"
    plan: "Atlassian Guard Standard"
    protocols: ["SAML"]
    notes: "Org admins configure SAML SSO with an identity provider for accounts on verified domains. It requires a subscription to Atlassian Guard Standard, which is bought separately for the organization."
    source: "https://support.atlassian.com/security-and-access-policies/docs/configure-saml-single-sign-on-with-an-identity-provider/"
    checked: "2026-11-20"
  sso_enforcement:
    support: "supported"
    tier: "add_on"
    plan: "Atlassian Guard Standard"
    notes: "Admins select Enforce single sign-on in an authentication policy, so SSO is required for the managed accounts in that policy."
    source: "https://support.atlassian.com/security-and-access-policies/docs/configure-saml-single-sign-on-with-an-identity-provider/"
    checked: "2026-11-20"
  scim:
    support: "supported"
    tier: "add_on"
    plan: "Atlassian Guard Standard"
    notes: "SCIM 2.0 user provisioning creates, updates and deactivates Atlassian accounts from the identity provider and syncs groups to Jira and Confluence."
    source: "https://support.atlassian.com/provisioning-users/docs/understand-user-provisioning/"
    checked: "2026-11-20"
  mfa_enforcement:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Org admins set two-step verification to Mandatory in an authentication policy for managed accounts. Available on all plans. With SSO enforced, 2FA is handled by the IdP instead."
    source: "https://support.atlassian.com/security-and-access-policies/docs/enforce-two-step-verification/"
    checked: "2026-11-20"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Admins can allow passkeys per authentication policy so managed users sign in to Atlassian products with a passkey. Blocked by default, and not offered when SSO is enforced."
    source: "https://support.atlassian.com/security-and-access-policies/docs/manage-passkey-authentication/"
    checked: "2026-11-20"
  audit_logs:
    support: "supported"
    tier: "add_on"
    plan: "Atlassian Guard Standard or Enterprise"
    notes: "The organization audit log lists activities with actor, app, IP address and time, and can be searched and filtered. It needs Atlassian Guard or an Enterprise plan; without them no org-level events are stored."
    source: "https://support.atlassian.com/security-and-access-policies/docs/view-audit-log-activities/"
    checked: "2026-11-20"
  jit_provisioning:
    support: "supported"
    tier: "add_on"
    plan: "Atlassian Guard Standard"
    notes: "After linking domains to the IdP directory and enforcing SAML SSO on the default policy, an Atlassian account is created when a user first logs in with SAML."
    source: "https://support.atlassian.com/security-and-access-policies/docs/configure-saml-single-sign-on-with-an-identity-provider/"
    checked: "2026-11-20"
  domain_verification:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Verifying a domain proves ownership and claims existing accounts on it, which become managed accounts that admins can edit, deactivate or delete. Available on all plans."
    source: "https://support.atlassian.com/user-management/docs/verify-a-domain-to-manage-accounts/"
    checked: "2026-11-20"
  custom_roles:
    support: "supported"
    tier: "paid"
    plan: "Standard"
    notes: "Jira admins create named space roles and grant them permissions in permission schemes. Free sites can't assign space roles or restrict permissions with schemes; Standard, Premium and Enterprise can."
    source: "https://support.atlassian.com/jira-cloud-administration/docs/permissions-limitations-in-free-jira-sites/"
    checked: "2026-11-20"
  group_role_mapping:
    support: "supported"
    tier: "add_on"
    plan: "Atlassian Guard Standard"
    notes: "SCIM syncs IdP groups to the organization and its sites, where admins assign groups app access and use them in Jira permissions."
    source: "https://support.atlassian.com/provisioning-users/docs/understand-user-provisioning/"
    checked: "2026-11-20"
  session_controls:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Admins set an idle session duration in an authentication policy for managed accounts, on all plans. A maximum session expiration also exists with Atlassian Guard Standard."
    source: "https://support.atlassian.com/security-and-access-policies/docs/update-idle-session-duration/"
    checked: "2026-11-20"
  api_token_controls:
    support: "supported"
    tier: "add_on"
    plan: "Atlassian Guard Standard"
    notes: "Org admins can revoke one or many of a managed account's API tokens under Insights, API token activity. Admins can also block API token access for external users."
    source: "https://support.atlassian.com/security-and-access-policies/docs/revoke-user-api-tokens/"
    checked: "2026-11-20"
