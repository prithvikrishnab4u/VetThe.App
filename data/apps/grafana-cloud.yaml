name: "Grafana Cloud"
category: "infrastructure"
website: "https://grafana.com"
description: "Grafana Cloud is a hosted observability platform for metrics, logs, traces and dashboards."
status: "draft"

capabilities:
  sso:
    support: "supported"
    protocols: ["SAML", "OIDC"]
    notes: "SAML is available in Grafana Enterprise and Grafana Cloud, set up through the UI, API or Terraform. Generic OAuth/OIDC is also available on Cloud. No specific Cloud plan is named."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/saml/"
    checked: "2026-09-27"
  sso_enforcement:
    support: "undocumented"
    notes: "The docs don't describe a way to require SSO for Grafana Cloud. The option to disable the login form is a config-file setting on the self-managed basic auth page, and Cloud Portal users can always sign in."
  scim:
    support: "supported"
    notes: "Available in Grafana Enterprise and Grafana Cloud. Syncs users and teams from Entra ID or Okta, and works only with SAML. No specific Cloud plan is named."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-scim-provisioning/"
    checked: "2026-09-27"
  mfa_enforcement:
    support: "not_supported"
    notes: "The docs say Grafana and the Grafana Cloud portal don't include built-in MFA, and suggest using an external identity provider that enforces it."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/"
    checked: "2026-09-27"
  phishing_resistant_mfa:
    support: "not_supported"
    notes: "There's no built-in MFA, so no built-in passkeys or security keys either. The docs point to an external identity provider instead."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/"
    checked: "2026-09-27"
  audit_logs:
    support: "supported"
    notes: "Available in Grafana Enterprise and Grafana Cloud. On Cloud, audit logs are exported to Loki after you ask support to turn them on, and standard ingest and retention rates apply. No specific Cloud plan is named."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/audit-grafana/"
    checked: "2026-09-27"
  jit_provisioning:
    support: "supported"
    notes: "The SAML allow_sign_up option, on by default, creates new Grafana users when they first sign in through SAML."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/saml/saml-configuration-options/"
    checked: "2026-09-27"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "supported"
    notes: "Available in Grafana Enterprise and Grafana Cloud. Custom roles are created through the RBAC HTTP API, Terraform or file provisioning, not in the UI."
    source: "https://grafana.com/docs/grafana/latest/administration/roles-and-permissions/access-control/create-custom-roles/"
    checked: "2026-09-27"
  group_role_mapping:
    support: "supported"
    notes: "SAML role sync maps IdP attribute values to Viewer, Editor, Admin or Grafana Admin, and team sync maps groups to teams. The docs say this is on select Grafana Cloud plans but don't name them."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/saml/configure-saml-team-role-mapping/"
    checked: "2026-09-27"
  session_controls:
    support: "partial"
    notes: "Users can remove their own sessions from their profile, and a Grafana admin can remove any user's sessions. Session lifetime limits are config-file settings, and the docs say the forced-logout workaround isn't available to Grafana Cloud customers."
    source: "https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/"
    checked: "2026-09-27"
  api_token_controls:
    support: "supported"
    notes: "Service account tokens have no expiry by default, but an expiry can be set. Users with Edit permission can disable service accounts and add or delete their tokens."
    source: "https://grafana.com/docs/grafana/latest/administration/service-accounts/"
    checked: "2026-09-27"
