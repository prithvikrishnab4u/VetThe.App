name: "Zendesk"
category: "sales_marketing"
website: "https://zendesk.com"
description: "Customer service software and support ticketing system."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Suite Team / Support Team"
    notes: "Enterprise SSO via SAML or JWT; available on all Suite and Support plans (no free plan)"
    protocols: ["SAML"]
    source: "https://support.zendesk.com/hc/en-us/articles/4408883587226-Enabling-SAML-single-sign-on"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Suite Team / Support Team"
    notes: "Admins can require users to sign in using enterprise SSO instead of offering multiple sign-in options"
    source: "https://support.zendesk.com/hc/en-us/articles/4408883587226-Enabling-SAML-single-sign-on"
    checked: "2026-09-15"
  scim:
    support: "not_supported"
    notes: "Zendesk states it does not currently support any official SCIM connections; IdPs use Zendesk API endpoints instead"
    source: "https://support.zendesk.com/hc/en-us/articles/8966513066138-Does-Zendesk-support-SCIM"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Suite Team / Support Team"
    notes: "Admins can require 2FA for all team members, end users, or both; methods are authenticator app, email, SMS; applies to Zendesk authentication only"
    source: "https://support.zendesk.com/hc/en-us/articles/4408826974874-Managing-two-factor-authentication"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Suite Enterprise / Support Enterprise"
    notes: "Records agent and admin changes to account settings; end-user activity not captured"
    retention: "Indefinite"
    source: "https://support.zendesk.com/hc/en-us/articles/4408828001434-Viewing-the-audit-log-for-changes-to-your-account"
    checked: "2026-09-15"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Suite Team"
    notes: "A Zendesk profile is created for any new user who signs in through SAML, JWT or OIDC SSO."
    source: "https://support.zendesk.com/hc/en-us/articles/4408887505690-Enabling-SAML-single-sign-on"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
