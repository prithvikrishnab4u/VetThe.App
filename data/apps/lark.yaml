name: "Lark"
category: "collaboration"
website: "https://www.larksuite.com"
description: "A unified collaboration suite that combines chat, docs, meetings, and project management in one app."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    protocols: ["SAML"]
    source: "https://www.larksuite.com/hc/en-US/articles/360048487935-admin-configure-saml-2.0-sso-login-okta-or-google"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Members in the SSO scope who are not exceptions must log in with the IdP account."
    source: "https://www.larksuite.com/hc/en-US/articles/639199964238-admin-configure-saml-2.0-sso-login-microsoft-entra-id"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SCIM 2.0 creates, updates and deactivates users."
    source: "https://www.larksuite.com/hc/en-US/articles/197178577922-admin-sync-user-data-through-scim-2.0"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Admins can turn on two-step verification for the whole organization and members cannot disable it."
    source: "https://www.larksuite.com/hc/en-US/articles/338760728523-admin-turn-on-two-step-verification-for-organization-members"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Users can add passkeys, including USB security keys."
    source: "https://www.larksuite.com/hc/en-US/articles/701640811546-add-passkey"
    checked: "2026-09-16"
  audit_logs:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    retention: "180 days"
    source: "https://www.larksuite.com/hc/en-US/articles/048989932690-admin-audit-member-activity"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Auto join via SSO creates Lark accounts on first IdP login."
    source: "https://www.larksuite.com/hc/en-US/articles/639199964238-admin-configure-saml-2.0-sso-login-microsoft-entra-id"
    checked: "2026-09-16"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
