name: "Citrix ShareFile"
category: "collaboration"
website: "https://www.sharefile.com"
description: "Content collaboration platform for secure file sharing."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Standard"
    notes: "Available for Standard, Advanced, Premium, Industry Advantage and Virtual Data Room; SAML 2.0 identity providers"
    protocols: ["SAML"]
    source: "https://docs.sharefile.com/en-us/sharefile/configure/account-settings/single-sign-on.html"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Standard"
    notes: "\"Require SSO sign in\" forces non-administrative Employees to log in through the identity provider; admins keep ShareFile credentials"
    source: "https://docs.sharefile.com/en-us/sharefile/configure/account-settings/single-sign-on.html"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise accounts"
    notes: "SCIM provisioning of users and groups, Enterprise accounts only; Microsoft Entra ID is the only supported IdP and nested groups are not supported"
    source: "https://docs.sharefile.com/en-us/sharefile/account_settings/user_provisioning"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "All plans"
    notes: "Two-step verification is enforced for all Employee users on all ShareFile accounts by default; admins can opt out via waiver"
    source: "https://docs.sharefile.com/en-us/sharefile/configure/admin-settings/two-step-verification.html"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Admin reports include Usage and Access reports covering login and failed login events; plan requirement not stated"
    retention: "Account lifetime, but reports can only be run in 90-day increments"
    source: "https://docs.sharefile.com/en-us/sharefile/configure/admin-settings/reports.html"
    checked: "2026-09-16"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
