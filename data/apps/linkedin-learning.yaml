name: "LinkedIn Learning"
category: "productivity"
website: "https://learning.linkedin.com"
description: "Online educational platform that helps you discover and develop business, technology-related, and creative skills."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "Supports SAML 2.0, LTI and Google SSO; admin configures the connection and sets SSO status to Active; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://learn.microsoft.com/en-us/linkedin/learning/sso-auth/sso-docs/sso-implementation"
    checked: "2026-09-16"
  sso_enforcement:
    support: "unknown"
  scim:
    support: "supported"
    notes: "SCIM user and group provisioning with Microsoft Entra ID (Azure AD) and Okta only; token generated by a Full Admin; plan requirement not stated"
    source: "https://learn.microsoft.com/en-us/linkedin/learning/user-and-attribute-management/user-attribute-mgmt-docs/scim"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "unknown"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "unknown"
  jit_provisioning:
    support: "supported"
    notes: "\"Automatically provision licenses\" toggle grants a license the first time a user authenticates via SSO; plan requirement not stated"
    source: "https://learn.microsoft.com/en-us/linkedin/learning/sso-auth/sso-docs/sso-implementation"
    checked: "2026-09-16"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
