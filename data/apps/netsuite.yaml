name: "NetSuite"
category: "finance"
website: "https://www.netsuite.com"
description: "Unified business management suite for ERP, financials, CRM, and ecommerce."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML Single Sign-on feature enabled under SuiteCloud features; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/subsect_1520718734.html"
    checked: "2026-09-15"
  sso_enforcement:
    support: "undocumented"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    notes: "Admins designate 2FA-required roles; mandatory for Administrator and highly privileged roles; no special licensing"
    source: "https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/chapter_N327688.html"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Login Audit Trail records user, time, IP and session transactions; plan requirement not stated"
    source: "https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_N324233.html"
    checked: "2026-09-15"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
