name: "Databricks"
category: "infrastructure"
website: "https://www.databricks.com"
description: "Data and AI company offering a unified lakehouse platform for data engineering, science, and analytics."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "Account-level SSO with unified login across workspaces (Databricks on AWS docs); plan requirement not stated"
    protocols: ["SAML", "OIDC"]
    source: "https://docs.databricks.com/aws/en/security/auth/single-sign-on/"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "With account SSO enabled, all users including admins must use SSO; emergency access for up to 20 users with password and security key; plan requirement not stated"
    source: "https://docs.databricks.com/aws/en/security/auth/single-sign-on/"
    checked: "2026-09-15"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Premium"
    notes: "Account-level SCIM for users and groups; automatic identity management is an alternative for Entra ID"
    source: "https://docs.databricks.com/aws/en/admin/users-groups/scim/"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "undocumented"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "system.access.audit system table (Public Preview); plan requirement not stated"
    source: "https://docs.databricks.com/aws/en/admin/system-tables/audit-logs"
    checked: "2026-09-15"
  jit_provisioning:
    support: "supported"
    notes: "JIT creates user accounts at first SSO login; plan requirement not stated"
    source: "https://docs.databricks.com/aws/en/security/auth/single-sign-on/"
    checked: "2026-09-15"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
