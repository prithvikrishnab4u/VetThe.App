name: "Bitwarden"
category: "security"
website: "https://bitwarden.com"
description: "Bitwarden is an open-source password manager for individuals and businesses, with a separate Secrets Manager for machine credentials."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    protocols: ["SAML", "OIDC"]
    notes: "Login with SSO is for Enterprise organizations and supports SAML 2.0 and OIDC."
    source: "https://bitwarden.com/help/about-sso/"
    checked: "2026-11-20"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "The Require single sign-on enterprise policy makes non-owner, non-admin members log in with SSO. On cloud it is not enforced for owners and admins; self-hosted servers can enforce it for them with an environment variable."
    source: "https://bitwarden.com/help/policies/"
    checked: "2026-11-20"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Teams"
    notes: "Teams and Enterprise organizations can use SCIM to provision and deprovision members and groups. Suspending a user in the IdP revokes their access."
    source: "https://bitwarden.com/help/about-scim/"
    checked: "2026-11-20"
  mfa_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "The Require two-step login enterprise policy makes members use a two-step login method to access their vaults."
    source: "https://bitwarden.com/help/policies/"
    checked: "2026-11-20"
  phishing_resistant_mfa:
    support: "supported"
    tier: "free"
    plan: "All plans"
    notes: "Two-step login with FIDO2 WebAuthn credentials, including security keys and passkeys, is free to all users. Passkeys can also be used to log in."
    source: "https://bitwarden.com/help/setup-two-step-login-fido/"
    checked: "2026-11-20"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "Teams"
    retention: "Kept indefinitely; up to 367 days viewable at a time"
    notes: "Teams and Enterprise organizations get event logs in the web app and through the Public API's /events endpoint."
    source: "https://bitwarden.com/help/event-logs/"
    checked: "2026-11-20"
  jit_provisioning:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "SSO for Enterprise organizations includes just-in-time provisioning of members."
    source: "https://bitwarden.com/help/about-sso/"
    checked: "2026-11-20"
  domain_verification:
    support: "partial"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Enterprise organizations claim a domain with a DNS TXT record. That blocks outside sign-ups on the domain and lets admins delete claimed members' accounts, but it only affects users who are already confirmed members; it does not pull in other accounts on the domain."
    source: "https://bitwarden.com/help/claimed-domains/"
    checked: "2026-11-20"
  custom_roles:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Besides owner, admin and user, Enterprise organizations can create custom roles with configurable permissions."
    source: "https://bitwarden.com/help/user-types-access-control/"
    checked: "2026-11-20"
  group_role_mapping:
    support: "supported"
    tier: "paid"
    plan: "Teams"
    notes: "SCIM syncs groups and their members from the IdP, and groups carry collection access."
    source: "https://bitwarden.com/help/about-scim/"
    checked: "2026-11-20"
  session_controls:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "The Session timeout enterprise policy sets a maximum timeout for members and whether a timed-out session locks or logs out."
    source: "https://bitwarden.com/help/policies/"
    checked: "2026-11-20"
  api_token_controls:
    support: "undocumented"
    notes: "The help center doesn't describe admins listing or revoking members' personal API keys. Secrets Manager access tokens belong to machine accounts, which is a different thing."
