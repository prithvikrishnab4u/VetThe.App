name: "Braze"
category: "sales_marketing"
website: "https://www.braze.com"
description: "Customer engagement platform that powers real-time interactions."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    notes: "SAML 2.0 dashboard SSO, turned on by account manager; plan requirement not stated"
    protocols: ["SAML"]
    source: "https://www.braze.com/docs/user_guide/administrative/access_braze/single_sign_on/set_up/"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    notes: "Security Settings can restrict login to SAML SSO only; plan requirement not stated"
    source: "https://www.braze.com/docs/user_guide/administer/global/admin_settings/security_settings"
    checked: "2026-09-15"
  scim:
    support: "supported"
    notes: "SCIM provisioning via Okta, Entra ID or SCIM API; availability depends on platform edition, plan not named"
    source: "https://www.braze.com/docs/user_guide/administer/global/user_management/automated_user_provisioning"
    checked: "2026-09-15"
  mfa_enforcement:
    support: "supported"
    notes: "Admins can require 2FA for all company users via app, email or SMS; plan requirement not stated"
    source: "https://www.braze.com/docs/user_guide/administer/global/admin_settings/security_settings"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    notes: "Security event report CSV export up to 10,000 events, S3 export for higher volume; plan requirement not stated"
    source: "https://www.braze.com/docs/user_guide/administer/global/admin_settings/security_settings"
    checked: "2026-09-15"
  jit_provisioning:
    support: "supported"
    notes: "SAML JIT provisioning with default workspace and permission set; Braze must enable the feature; plan requirement not stated"
    source: "https://www.braze.com/docs/user_guide/administrative/access_braze/single_sign_on/saml_jit"
    checked: "2026-09-15"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    notes: "Configurable inactivity timeout and dashboard IP allowlisting; plan requirement not stated"
    source: "https://www.braze.com/docs/user_guide/administer/global/admin_settings/security_settings"
    checked: "2026-09-15"
  api_token_controls:
    support: "not_researched"
