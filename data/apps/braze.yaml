name: "Braze"
category: "sales_marketing"
website: "https://www.braze.com"
description: "Customer engagement platform that powers real-time interactions."
status: "published"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    plan: "Braze Go"
    protocols: ["SAML"]
    notes: "SAML 2.0 dashboard SSO, turned on by account manager; \"SAML & Single-Sign On (SSO)\" listed as included in every tier on the pricing page"
    source: "https://www.braze.com/pricing"
    checked: "2026-09-16"
  sso_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Braze Go"
    notes: "Security Settings can restrict login to SAML SSO only; SSO itself is included in every tier per the pricing page"
    source: "https://www.braze.com/pricing"
    checked: "2026-09-16"
  scim:
    support: "supported"
    tier: "paid"
    plan: "Braze Select"
    notes: "SCIM provisioning via Okta, Entra ID or SCIM API; pricing page lists \"Enhanced security features and user provisioning\" as added at the Select tier (above the base Go tier)"
    source: "https://www.braze.com/pricing"
    checked: "2026-09-16"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
    plan: "Braze Go"
    notes: "Admins can require 2FA for all company users via app, email or SMS; \"Two-Factor Authentication (2FA)\" listed as included in every tier on the pricing page"
    source: "https://www.braze.com/pricing"
    checked: "2026-09-16"
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "paid"
    plan: "Braze Go"
    notes: "Security event report CSV export up to 10,000 events, S3 export for higher volume; \"Security settings & event logs\" listed as included in every tier on the pricing page"
    source: "https://www.braze.com/pricing"
    checked: "2026-09-16"
  jit_provisioning:
    support: "supported"
    tier: "paid"
    plan: "Braze Select"
    notes: "SAML JIT provisioning with default workspace and permission set; Braze must enable the feature; pricing page lists \"user provisioning\" as added at the Select tier"
    source: "https://www.braze.com/pricing"
    checked: "2026-09-16"
  domain_verification:
    support: "undocumented"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "supported"
    tier: "paid"
    plan: "Braze Go"
    notes: "Configurable inactivity timeout and dashboard IP allowlisting, under the same Security Settings included in every tier per the pricing page"
    source: "https://www.braze.com/pricing"
    checked: "2026-09-16"
  api_token_controls:
    support: "not_researched"
