name: "PagerDuty"
category: "infrastructure"
website: "https://www.pagerduty.com"
description: "Incident management platform that provides reliable notifications, automatic escalations, and on-call scheduling."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    protocols: ["SAML"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "unknown"
  mfa_enforcement:
    support: "supported"
    tier: "paid"
  phishing_resistant_mfa:
    support: "supported"
  audit_logs:
    support: "unknown"
  jit_provisioning:
    support: "supported"
  domain_verification:
    support: "supported"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "unknown"
  api_token_controls:
    support: "unknown"
