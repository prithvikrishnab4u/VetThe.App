name: "Zoom"
category: "collaboration"
website: "https://zoom.us"
description: "Video conferencing and communication platform for teams and individuals."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "paid"
    protocols: ["SAML"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "supported"
    tier: "paid"
  mfa_enforcement:
    support: "supported"
    tier: "free"
  phishing_resistant_mfa:
    support: "unknown"
  audit_logs:
    support: "supported"
    tier: "paid"
    retention: "180 days"
  jit_provisioning:
    support: "unknown"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "supported"
  api_token_controls:
    support: "unknown"
