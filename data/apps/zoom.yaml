name: Zoom
category: collaboration
website: https://zoom.us
description: Video conferencing and communication platform for teams and individuals.
status: draft
capabilities:
  sso:
    support: supported
    tier: paid
    plan: Business
    notes: Needs an approved vanity URL
    protocols:
    - SAML
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0060673
    checked: '2026-09-14'
  sso_enforcement:
    support: supported
    tier: paid
    plan: Business
    notes: Can force SSO for users when the account has an associated domain
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0064901
    checked: '2026-09-14'
  scim:
    support: supported
    tier: paid
    plan: Business
    notes: Needs an approved vanity URL and SSO; creates, updates and deactivates
      users
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0058988
    checked: '2026-09-14'
  mfa_enforcement:
    support: supported
    tier: paid
    plan: Pro
    notes: Can be required for all users, or for specific roles or groups
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0066054
    checked: '2026-09-14'
  phishing_resistant_mfa:
    support: supported
    tier: paid
    plan: Pro
    notes: Passkey sign-in, turned on by an admin in security settings
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0083521
    checked: '2026-09-14'
  audit_logs:
    support: supported
    tier: paid
    plan: Pro
    notes: Admin activity logs with CSV export
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0067251
    checked: '2026-09-14'
  jit_provisioning:
    support: supported
    tier: paid
    plan: Business
    notes: Creates the account on first SAML sign-in
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0060673
    checked: '2026-09-14'
  domain_verification:
    support: unknown
  custom_roles:
    support: unknown
  group_role_mapping:
    support: unknown
  session_controls:
    support: supported
    tier: paid
    plan: Pro
    notes: Automatic sign-out period (default 90 days) and inactivity timeout
    source: https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0064901
    checked: '2026-09-14'
  api_token_controls:
    support: unknown
provenance:
  source: auto-verified
  source_url: https://zoom.us
  verified_by: auto-verified
  verified_date: '2026-09-14'
  evidence: sso
