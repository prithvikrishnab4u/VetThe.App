name: "Ashby"
category: "hr"
website: "https://www.ashbyhq.com"
description: "Ashby is an all-in-one recruiting and applicant tracking platform for hiring teams."
status: "draft"

capabilities:
  sso:
    support: "supported"
    tier: "add_on"
    plan: "SSO add-on ($100/month, all plans)"
    protocols: ["SAML", "OIDC"]
    notes: "SSO via SAML and OIDC available as a $100/month add-on on all plans."
    source: "https://www.ashbyhq.com/pricing"
    checked: "2026-09-22"
  sso_enforcement:
    support: "undocumented"
    notes: "Pricing and security pages do not state whether password login can be disabled once SSO is enabled."
  scim:
    support: "supported"
    tier: "paid"
    plan: "Plus"
    notes: "SCIM Directory Sync provisions and deactivates user accounts automatically; included on Plus and Enterprise plans, not on Foundations."
    source: "https://www.ashbyhq.com/pricing"
    checked: "2026-09-22"
  mfa_enforcement:
    support: "undocumented"
    notes: "Security page describes 2FA requirements for Ashby employees, not a customer-facing MFA enforcement setting for app users."
  phishing_resistant_mfa:
    support: "undocumented"
  audit_logs:
    support: "supported"
    tier: "free"
    plan: "Foundations"
    notes: "User Audit Log tracks permission changes with timestamps; included on all plans including Foundations."
    source: "https://www.ashbyhq.com/pricing"
    checked: "2026-09-22"
  jit_provisioning:
    support: "not_supported"
    notes: "Docs say Ashby does not support just-in-time provisioning through SSO; users signing in through SSO must already have an account. Google and Microsoft sign-in have a separate limited-access path."
    source: "https://docs.ashbyhq.com/sso-and-scim"
    checked: "2026-09-24"
  domain_verification:
    support: "not_supported"
    notes: "Docs FAQ answers it directly: no log streams and no domain verification."
    source: "https://docs.ashbyhq.com/sso-and-scim"
    checked: "2026-09-24"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
