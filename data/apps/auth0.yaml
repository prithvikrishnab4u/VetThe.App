name: "Auth0"
category: "security"
website: "https://auth0.com"
description: "Customer identity and access management platform for developers (acquired by Okta)."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "free"
    protocols: ["SAML", "OIDC", "WS-Fed"]
  sso_enforcement:
    support: "unknown"
  scim:
    support: "supported"
    tier: "paid"
  mfa_enforcement:
    support: "supported"
    tier: "free"
  phishing_resistant_mfa:
    support: "supported"
  audit_logs:
    support: "supported"
    tier: "free"
  jit_provisioning:
    support: "unknown"
  domain_verification:
    support: "unknown"
  custom_roles:
    support: "unknown"
  group_role_mapping:
    support: "unknown"
  session_controls:
    support: "supported"
  api_token_controls:
    support: "unknown"
