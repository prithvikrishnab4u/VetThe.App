name: "Auth0"
category: "security"
website: "https://auth0.com"
description: "Customer identity and access management platform for developers (acquired by Okta)."
status: "draft"

# One block per capability. Field meanings and allowed values: CONTRIBUTING.md
capabilities:
  sso:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Dashboard SSO for tenant members via enterprise IdP, set up with Auth0 Support; no IdP-initiated flows"
    protocols: ["SAML", "OIDC"]
    source: "https://auth0.com/docs/get-started/manage-dashboard-access/configure-single-sign-on-for-auth0-dashboard"
    checked: "2026-09-15"
  sso_enforcement:
    support: "supported"
    tier: "enterprise"
    plan: "Enterprise"
    notes: "Auth0 Teams security policies enforce SSO for team tenants; Early Access on Public Cloud Enterprise"
    source: "https://auth0.com/docs/get-started/tenant-settings/auth0-teams/configure-security-policies"
    checked: "2026-09-15"
  scim:
    support: "undocumented"
  mfa_enforcement:
    support: "not_supported"
    notes: "MFA cannot be enforced for all members of a tenant; dashboard users self-enroll"
    source: "https://auth0.com/docs/get-started/manage-dashboard-access/configure-single-sign-on-for-auth0-dashboard"
    checked: "2026-09-15"
  phishing_resistant_mfa:
    support: "supported"
    notes: "Dashboard users can enroll WebAuthn security keys or device biometrics; plan requirement not stated"
    source: "https://auth0.com/docs/get-started/manage-dashboard-access/add-change-remove-mfa"
    checked: "2026-09-15"
  audit_logs:
    support: "undocumented"
  jit_provisioning:
    support: "not_researched"
  domain_verification:
    support: "not_researched"
  custom_roles:
    support: "not_researched"
  group_role_mapping:
    support: "not_researched"
  session_controls:
    support: "not_researched"
  api_token_controls:
    support: "not_researched"
