name: Validate App Data

on:
  pull_request:
    paths:
      - "data/apps/*.yaml"
      - "data/schema.yaml"
      - "scripts/validate.py"
  push:
    branches:
      - main
    paths:
      - "data/apps/*.yaml"
      - "data/schema.yaml"
      - "scripts/validate.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run validation
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate.py | tee validation.txt

      # One comment per PR, updated on every push, showing the validator's own output.
      # Pull requests from forks get a read-only token, so this step may be skipped there.
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- vetthe-validation -->';
            const output = fs.readFileSync('validation.txt', 'utf8').trim().slice(-60000);
            const passed = process.env.OUTCOME === 'success';
            const body = [
              marker,
              passed ? '✅ **Validation passed.** Thanks for contributing!' : '❌ **Validation failed.** Fix the errors below and push again.',
              '',
              '<details' + (passed ? '' : ' open') + '><summary>Validator output</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
              '',
              passed ? '' : 'Field rules are in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md). Stuck? Ask in a comment.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if validation failed
        if: steps.validate.outcome != 'success'
        run: exit 1
