name: CI — generate, validate, build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run data generator
        run: |
          python scripts/generate_data.py

      - name: Run validator
        run: |
          python scripts/validate.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node deps
        working-directory: site
        run: |
          npm ci

      # Pinned to the version Cloudflare Pages runs, so a green CI means the
      # deploy will build too. Bump both together.
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.7'
          extended: true

      - name: Build Hugo site
        working-directory: site
        run: |
          hugo --minify
