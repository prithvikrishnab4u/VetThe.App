baseURL = 'https://vetthe.app/'
locale = 'en-us'
title = 'VetThe.App - IAM Capabilities of SaaS Apps'
dataDir = "../data"

[build]
  [[build.cachebusters]]
    source = "assets/css/main\\.css"
    target = "css/main\\..*\\.css"

# Merge everything under ONE params table
[params]
  description = 'Community-driven comparison of identity security features across SaaS applications'
  # This helps Hugo find your CSS for the Tailwind pipeline
  css_main = "css/main.css"

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
    osEnv = ['(?i)^((HTTPS?|NO)_PROXY|PATH(EXT)?|APPDATA|TE?MP|TERM|GO\\w+|(XDG_CONFIG_)?HOME|USERPROFILE|SSH_AUTH_SOCK|DISPLAY|LANG|SYSTEMDRIVE|PROGRAMDATA)$']

  [security.node]
    [security.node.permissions]
      allowAddons = ['tailwindcss']
      allowChildProcess = ['tailwindcss']
      allowRead = ['.']
      allowWorker = ['tailwindcss']
      allowWrite = []
      disable = false