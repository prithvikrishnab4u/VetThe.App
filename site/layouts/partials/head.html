<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetThe.App - IAM Capabilities of SaaS Apps</title>
    <meta name="description" content="Community-driven, open-source catalogue of the IAM capabilities of SaaS apps: SSO, SCIM, MFA and SSO enforcement, audit logs, roles, and the plan each one needs. Every value links to its source.">
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vetthe.app/">
    <meta property="og:title" content="VetThe.App - IAM Capabilities of SaaS Apps">
    <meta property="og:description" content="Community-driven catalogue of SaaS IAM capabilities. Compare SSO, SCIM, MFA and SSO enforcement, audit logs and roles, and the plan each one needs.">
    <meta property="og:image" content="https://vetthe.app/og-image.png">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://vetthe.app/">
    <meta property="twitter:title" content="VetThe.App - IAM Capabilities of SaaS Apps">
    <meta property="twitter:description" content="Community-driven catalogue of SaaS IAM capabilities. Compare SSO, SCIM, MFA and SSO enforcement, audit logs and roles, and the plan each one needs.">
    <meta property="twitter:image" content="https://vetthe.app/og-image.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">

    {{ $css := resources.Get "css/main.css" | css.TailwindCSS }}
    {{ if not hugo.IsDevelopment }}
    {{ $css = $css | minify | fingerprint }}
    {{ end }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}">

    <!-- Apply the saved or system theme before first paint to avoid a flash -->
    <script>
        (function () {
            var theme = null;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
