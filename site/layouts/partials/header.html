{{ $repo := "https://github.com/prithvikrishnab4u/VetThe.App" }}
<header class="sticky top-0 z-50 border-b border-white/10 bg-[#070a14]/75 backdrop-blur-xl text-white">

            <svg width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true">
                <defs>
                    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2563eb" />
                        <stop offset="100%" stop-color="#7c3aed" />

                </defs>
                <rect width="40" height="40" rx="10" fill="url(#headerGradient)" />
                <path d="M13 19L18 24L27 13" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

            <span class="text-base font-bold tracking-tight text-white">VetThe<span class="text-indigo-300">.App</span></span>

            <span class="text-white/25">/</span>
