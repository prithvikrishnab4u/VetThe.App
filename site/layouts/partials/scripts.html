<script>
(function() {
    const table = document.getElementById('appsTable');
    const tbody = document.getElementById('tableBody');
    const filterApp = document.getElementById('filterApp');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const toggleExtendedBtn = document.getElementById('toggleExtendedBtn');
    const resultCount = document.getElementById('resultCount');

    // Capability cell values set by table.html (data-value), in sort/filter order
    const VALUE_ORDER = ['Free', 'Paid', 'Enterprise', 'Add-on', 'Supported', 'Partial', 'No', 'Unknown'];

    const allRows = Array.from(tbody.querySelectorAll('tr'));
    allRows.forEach(row => {
        row.values = { app: row.dataset.app, category: row.dataset.category };
        row.querySelectorAll('td[data-cap]').forEach(td => {
            row.values[td.dataset.cap] = td.dataset.value;
        });
    });

    let filteredRows = [...allRows];
    let currentPage = 1;
    let rowsPerPage = 25;
    let sortColumn = null;
    let sortDirection = 'asc';

    // Flowbite-style Dropdown Class
    class FlowbiteDropdown {
        constructor(containerId, isMulti = false) {
            this.container = document.getElementById(containerId);
            if (!this.container) return;

            this.button = this.container.querySelector('.dropdown-button');
            this.buttonText = this.button.querySelector('span');
            this.dropdown = this.container.querySelector('.flowbite-dropdown');
            this.isMulti = isMulti;
            this.selected = new Set();

            this.init();
        }

        init() {
            // Toggle dropdown
            this.button.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                this.toggle();
            });

            // Close on outside click
            document.addEventListener('click', (e) => {
                if (!this.container.contains(e.target)) {
                    this.close();
                }
            });

            // Prevent dropdown from closing when clicking inside
            this.dropdown.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }

        setOptions(options) {
            this.dropdown.innerHTML = '';

            // Add search for long lists
            if (options.length > 8) {
                const searchDiv = document.createElement('div');
                searchDiv.className = 'sticky top-0 bg-white border-b border-gray-200 p-2';
                searchDiv.innerHTML = `
                    <input type="text"
                           placeholder="Search..."
                           class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none">
                `;
                this.dropdown.appendChild(searchDiv);

                const searchInput = searchDiv.querySelector('input');
                searchInput.addEventListener('input', (e) => {
                    e.stopPropagation();
                    const query = e.target.value.toLowerCase();
                    const opts = this.dropdown.querySelectorAll('.dropdown-option');
                    opts.forEach(opt => {
                        const text = opt.textContent.toLowerCase();
                        opt.style.display = text.includes(query) ? 'flex' : 'none';
                    });
                });
                searchInput.addEventListener('click', (e) => e.stopPropagation());
            }

            // Add options
            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'dropdown-option';

                if (this.isMulti) {
                    const checkboxId = `${this.container.id}_${opt.replace(/\s+/g, '_')}`;
                    div.innerHTML = `
                        <input type="checkbox"
                               id="${checkboxId}"
                               value="${opt}"
                               class="flowbite-checkbox"
                               ${this.selected.has(opt) ? 'checked' : ''}>
                        <label for="${checkboxId}" class="ml-2 text-sm font-medium text-gray-900 cursor-pointer capitalize flex-1">${opt.replace(/_/g, ' ')}</label>
                    `;

                    const checkbox = div.querySelector('input');
                    const label = div.querySelector('label');

                    const handleChange = (e) => {
                        e.stopPropagation();
                        if (checkbox.checked) {
                            this.selected.add(opt);
                        } else {
                            this.selected.delete(opt);
                        }
                        this.updateButtonText();
                        applyFilters();
                    };

                    checkbox.addEventListener('change', handleChange);
                    checkbox.addEventListener('click', (e) => e.stopPropagation());
                    label.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        checkbox.checked = !checkbox.checked;
                        handleChange(e);
                    });
                } else {
                    div.innerHTML = `<label class="text-sm font-medium text-gray-900 cursor-pointer capitalize flex-1">${opt}</label>`;
                    div.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.selected.clear();
                        this.selected.add(opt);
                        this.updateButtonText();
                        applyFilters();
                        this.close();
                    });
                }

                this.dropdown.appendChild(div);
            });

            // Add Clear button for multi-select
            if (this.isMulti && options.length > 0) {
                const footer = document.createElement('div');
                footer.className = 'sticky bottom-0 bg-white border-t border-gray-200 p-2';
                footer.innerHTML = '<button class="w-full px-3 py-2 text-sm font-medium text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">Clear Selection</button>';
                const clearBtn = footer.querySelector('button');
                clearBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    this.clear();
                });
                this.dropdown.appendChild(footer);
            }
        }

        toggle() {
            const isOpen = this.dropdown.classList.contains('open');

            // Close all other dropdowns
            document.querySelectorAll('.flowbite-dropdown.open').forEach(d => {
                if (d !== this.dropdown) d.classList.remove('open');
            });

            if (isOpen) {
                this.close();
            } else {
                // Calculate position for fixed dropdown
                const rect = this.button.getBoundingClientRect();
                this.dropdown.style.top = `${rect.bottom + 4}px`;
                this.dropdown.style.left = `${rect.left}px`;
                this.dropdown.style.width = `${Math.max(rect.width, 180)}px`;
                this.dropdown.classList.add('open');
            }
        }

        close() {
            this.dropdown.classList.remove('open');
        }

        clear() {
            this.selected.clear();
            this.dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            this.updateButtonText();
            applyFilters();
        }

        updateButtonText() {
            if (this.selected.size === 0) {
                this.buttonText.textContent = 'All';
                this.buttonText.className = 'text-gray-500';
            } else if (this.selected.size === 1) {
                const value = Array.from(this.selected)[0].replace(/_/g, ' ');
                this.buttonText.textContent = value.charAt(0).toUpperCase() + value.slice(1);
                this.buttonText.className = 'text-gray-900 font-medium';
            } else {
                this.buttonText.textContent = `${this.selected.size} selected`;
                this.buttonText.className = 'text-gray-900 font-medium';
            }
        }

        getSelected() {
            return this.selected;
        }
    }

    // One multi-select dropdown for category and for every capability column
    const dropdowns = { category: new FlowbiteDropdown('filterCategoryContainer', true) };
    document.querySelectorAll('[data-filter-cap]').forEach(el => {
        dropdowns[el.dataset.filterCap] = new FlowbiteDropdown(el.id, true);
    });

    function compareValues(column, a, b) {
        if (column === 'app' || column === 'category') return a.localeCompare(b);
        return VALUE_ORDER.indexOf(a) - VALUE_ORDER.indexOf(b);
    }

    // Populate filter options from the values present in the table
    function populateFilters() {
        Object.entries(dropdowns).forEach(([column, dropdown]) => {
            const values = Array.from(new Set(allRows.map(row => row.values[column]).filter(Boolean)));
            dropdown.setOptions(values.sort((a, b) => compareValues(column, a, b)));
        });
    }

    // Apply all filters
    function applyFilters() {
        const appQuery = filterApp.value.toLowerCase();

        filteredRows = allRows.filter(row => {
            if (appQuery && !row.values.app.toLowerCase().includes(appQuery)) {
                return false;
            }
            return Object.entries(dropdowns).every(([column, dropdown]) => {
                const selected = dropdown.getSelected();
                return selected.size === 0 || selected.has(row.values[column]);
            });
        });

        if (sortColumn) sortRows();
        currentPage = 1;
        renderTable();
    }

    // Sort table
    function sortTable(column) {
        if (sortColumn === column) {
            sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
            sortColumn = column;
            sortDirection = 'asc';
        }

        sortRows();
        updateSortIndicators();
        renderTable();
    }

    function sortRows() {
        filteredRows.sort((a, b) => {
            const result = compareValues(sortColumn, a.values[sortColumn] || '', b.values[sortColumn] || '');
            return sortDirection === 'asc' ? result : -result;
        });
    }

    function updateSortIndicators() {
        document.querySelectorAll('.sort-indicator').forEach(ind => {
            ind.textContent = '⇅';
            ind.classList.remove('active');
        });

        const activeHeader = document.querySelector(`[data-column="${sortColumn}"]`);
        if (activeHeader) {
            const indicator = activeHeader.querySelector('.sort-indicator');
            indicator.textContent = sortDirection === 'asc' ? '↑' : '↓';
            indicator.classList.add('active');
        }
    }

    // Render table with pagination
    function renderTable() {
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageRows = filteredRows.slice(start, end);

        // Hide all rows, then show the current page in sorted order
        allRows.forEach(row => row.style.display = 'none');
        pageRows.forEach(row => {
            row.style.display = '';
            tbody.appendChild(row);
        });

        // Update counts
        resultCount.textContent = filteredRows.length;
        document.getElementById('pageStart').textContent = filteredRows.length > 0 ? start + 1 : 0;
        document.getElementById('pageEnd').textContent = Math.min(end, filteredRows.length);
        document.getElementById('totalRows').textContent = filteredRows.length;

        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredRows.length / rowsPerPage);
        const controls = document.getElementById('paginationControls');
        controls.innerHTML = '';

        if (totalPages <= 1) return;

        // Previous button
        const prevBtn = document.createElement('button');
        prevBtn.className = 'pagination-btn';
        prevBtn.innerHTML = `
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
        `;
        prevBtn.disabled = currentPage === 1;
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        });
        controls.appendChild(prevBtn);

        // Page numbers
        const maxButtons = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
        let endPage = Math.min(totalPages, startPage + maxButtons - 1);

        if (endPage - startPage < maxButtons - 1) {
            startPage = Math.max(1, endPage - maxButtons + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            const btn = document.createElement('button');
            btn.className = 'pagination-btn' + (i === currentPage ? ' active' : '');
            btn.textContent = i;
            btn.addEventListener('click', () => {
                currentPage = i;
                renderTable();
            });
            controls.appendChild(btn);
        }

        // Next button
        const nextBtn = document.createElement('button');
        nextBtn.className = 'pagination-btn';
        nextBtn.innerHTML = `
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
            </svg>
        `;
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        });
        controls.appendChild(nextBtn);
    }

    // Clear all filters
    function clearAll() {
        filterApp.value = '';
        Object.values(dropdowns).forEach(d => d.clear());
        applyFilters();
    }

    // Show or hide the non-core capability columns
    const extendedLabel = toggleExtendedBtn.textContent.trim();
    toggleExtendedBtn.addEventListener('click', () => {
        const showing = table.classList.toggle('show-extended');
        toggleExtendedBtn.textContent = showing ? 'Show core capabilities only' : extendedLabel;
    });

    // Event listeners
    filterApp.addEventListener('input', applyFilters);
    clearAllBtn.addEventListener('click', clearAll);

    // Sortable headers
    document.querySelectorAll('th[data-column]').forEach(th => {
        th.addEventListener('click', () => {
            sortTable(th.dataset.column);
        });
    });

    // Initialize
    populateFilters();
    renderTable();
})();
</script>
